<style>
:root{--bg:#f6f0e9;--bg2:#eee3d9;--card:#fffaf5;--input:#fffdfa;--ink:#382923;--mut:#66554e;--accent:#765046;--rose:#9d6570;--fill:#765046;--soft:#f1e6de;--gold:#93764c;--border:#d9c9bc;--iborder:#aa9182;--error:#a33836;--alert-bg:#f8e9e4;--alert-border:#b77870;--alert-text:#71342f;--ai:#fffaf5;--bubble-ink:#fffaf5;--shadow:0 18px 52px rgba(61,37,30,.09);--glow:rgba(169,114,92,.11);--focus:rgba(147,118,76,.19);--bubble-start:#875a53;--bubble-end:#6a4240;--glass:rgba(255,250,245,.86)}
body[data-t=dark]{color-scheme:dark;--bg:#241c1d;--bg2:#302426;--card:#332729;--input:#292023;--ink:#fff2e8;--mut:#dbc6bb;--accent:#efd3bc;--rose:#e5adb4;--fill:#805251;--soft:#443235;--gold:#e0c294;--border:#71565a;--iborder:#a18280;--error:#ffb6ac;--alert-bg:#56383a;--alert-border:#d39b92;--alert-text:#ffe2db;--ai:#382a2b;--bubble-ink:#fff7f2;--shadow:0 18px 52px rgba(0,0,0,.22);--glow:rgba(225,170,143,.09);--focus:rgba(224,194,148,.22);--bubble-start:#885959;--bubble-end:#694246;--glass:rgba(51,39,41,.92)}
body[data-accent=burgundy]{--bg:#f8f4ed;--bg2:#eee6dd;--card:#fffdf8;--input:#fffdfa;--ink:#3a252b;--mut:#67515a;--accent:#713b4b;--rose:#945963;--fill:#713b4b;--soft:#f3e8e8;--gold:#967847;--border:#ddcdd0;--iborder:#ad9198;--bubble-start:#833e53;--bubble-end:#632e42;--glass:rgba(255,253,248,.9)}
body[data-accent=burgundy][data-t=dark]{--bg:#27171d;--bg2:#341e27;--card:#3a2530;--input:#2e1d26;--ink:#fff2e9;--mut:#ddc7ca;--accent:#f1ccd1;--rose:#e4a7b2;--fill:#854e60;--soft:#50323e;--gold:#e2c695;--border:#74525e;--iborder:#a57e89;--bubble-start:#914e64;--bubble-end:#723e56;--glass:rgba(58,37,48,.93)}
body[data-accent=sage]{--bg:#f3f4ee;--bg2:#e8ede4;--card:#fffef9;--input:#fffefa;--ink:#28392e;--mut:#506355;--accent:#49644e;--rose:#846b67;--fill:#49644e;--soft:#e9eee5;--gold:#877446;--border:#cad7c8;--iborder:#839b84;--bubble-start:#5d795e;--bubble-end:#3f6048;--glass:rgba(255,254,249,.9)}
body[data-accent=sage][data-t=dark]{--bg:#1e2923;--bg2:#27372c;--card:#2d3c32;--input:#243229;--ink:#f4f4e9;--mut:#c8d9c8;--accent:#d3e7c8;--rose:#d8b6a9;--fill:#54735a;--soft:#3a5040;--gold:#ddca94;--border:#57705b;--iborder:#91aa91;--bubble-start:#5c8263;--bubble-end:#426249;--glass:rgba(45,60,50,.93)}
body[data-accent=emerald]{--bg:#f3f5f0;--bg2:#e9efea;--card:#fffefa;--input:#fff;--ink:#15362f;--mut:#536d62;--accent:#48664e;--rose:#9c6466;--fill:#17604e;--soft:#e9f0e8;--gold:#806840;--border:#cbdad0;--iborder:#879f91;--bubble-start:#26725d;--bubble-end:#135343;--glass:rgba(255,254,250,.9)}
body[data-accent=emerald][data-t=dark]{--bg:#102c29;--bg2:#173a35;--card:#1c403a;--input:#14342f;--ink:#f6f4ea;--mut:#c8d5cc;--accent:#eed9ad;--rose:#edc4c0;--fill:#356e60;--soft:#254b43;--gold:#e4ca99;--border:#527267;--iborder:#789588;--bubble-start:#397d6b;--bubble-end:#22574e;--glass:rgba(28,64,58,.93)}
body[data-accent=navy]{--bg:#f5f5f2;--bg2:#ebeef0;--card:#fff;--input:#fff;--ink:#1b3144;--mut:#526778;--accent:#37546b;--rose:#855254;--fill:#294b64;--soft:#e9edf0;--gold:#826158;--border:#cbd4db;--iborder:#8296a5;--bubble-start:#426b83;--bubble-end:#284b65;--glass:rgba(255,255,255,.9)}
body[data-accent=navy][data-t=dark]{--bg:#142334;--bg2:#1d3041;--card:#23394a;--input:#192c3d;--ink:#f9f6f1;--mut:#d1d9de;--accent:#f0e8d8;--rose:#f0bdb3;--fill:#465e72;--soft:#2e4558;--gold:#dcb5a6;--border:#526a79;--iborder:#8095a0;--bubble-start:#506f83;--bubble-end:#334d68;--glass:rgba(35,57,74,.93)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{width:100%;min-height:100%;margin:0;padding-bottom:calc(196px + env(safe-area-inset-bottom));font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 12% 4%,var(--glow),transparent 43%),radial-gradient(ellipse at 92% 67%,var(--glow),transparent 40%)}
.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.wrap{width:100%;max-width:760px;margin:auto;padding:23px 20px 32px}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.08}
h1{font-size:clamp(38px,9vw,53px);margin:8px 0 12px}h2{font-size:31px;margin:0 0 12px}h3{font-size:22px;margin:0 0 8px}
.eyebrow{display:block;color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin:24px 0 8px}
.mut{color:var(--mut);font-size:13px;line-height:1.7}.subtle{font-size:12px;color:var(--mut)}
.card{position:relative;background:var(--glass);border:1px solid var(--border);border-radius:27px;padding:23px;margin:16px 0;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(18px)}
.card:before{content:"";position:absolute;top:0;left:25px;width:30px;height:1px;background:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:46px;width:100%;padding:12px 16px;margin-top:10px;border:1px solid transparent;border-radius:16px;background:var(--soft);font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s,transform .2s,opacity .2s}
button:hover:not(:disabled){border-color:var(--gold)}button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.55;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button.p{background:var(--fill);color:var(--bubble-ink);border-color:var(--gold)}button.d{background:var(--alert-bg);color:var(--alert-text);border-color:var(--alert-border)}
button.q{background:transparent;color:var(--mut)}
.round{width:48px;height:48px;min-height:48px;padding:0;margin:0;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:17px}
input,select,textarea{width:100%;min-height:48px;padding:13px 15px;border-radius:15px;border:1px solid var(--iborder);background:var(--input);margin:8px 0 15px;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--focus);outline:0}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.85}
input[type=checkbox]{width:19px;min-height:19px;height:19px;margin:0 9px 0 0;accent-color:var(--fill)}
input[type=range]{accent-color:var(--gold);padding:0;min-height:32px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--mut)}
.checklabel{display:flex;align-items:center;min-height:47px;line-height:1.5}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}.row.fr{align-items:flex-end}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 1px 18px;margin-bottom:15px;border-bottom:1px solid var(--border)}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:29px;font-weight:700;display:flex;align-items:center;gap:11px;white-space:nowrap}
.mark{display:inline-grid;place-items:center;width:43px;height:43px;flex:none;border:1px solid var(--gold);border-radius:15px;background:var(--soft);color:var(--accent)}
.mark svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.alert{width:100%;min-height:49px;margin:13px 0;padding:12px 14px;border:1px solid var(--alert-border);border-radius:16px;background:var(--alert-bg);color:var(--alert-text);display:flex;align-items:center;gap:10px;text-align:left;font-size:12px;font-weight:600}
.alert:before{content:"!";width:20px;height:20px;display:inline-grid;place-items:center;flex:none;border:1px solid currentColor;border-radius:50%}
#nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:680px;z-index:20;display:flex;gap:4px;padding:7px;border:1px solid var(--border);border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
#nav button{position:relative;flex:1;width:auto;min-width:0;min-height:59px;margin:0;padding:7px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:999px;background:transparent;color:var(--mut);font-size:10px}
#nav button.a{color:var(--ink);background:var(--soft);border-color:var(--border)}
#nav button.a:after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.msg{display:flex;flex-direction:column;margin:16px 0;animation:up .32s ease both}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.msg.me{align-items:flex-end}.msg.ai{align-items:flex-start}
.bub{max-width:min(89%,620px);padding:15px 18px;border-radius:23px;line-height:1.68;font-size:14px;overflow-wrap:anywhere}
.me .bub{background:linear-gradient(135deg,var(--bubble-start),var(--bubble-end));color:var(--bubble-ink);border:1px solid var(--gold);border-bottom-right-radius:7px;white-space:pre-wrap}
.ai .bub{background:var(--ai);border:1px solid var(--border);border-left:2px solid var(--gold);border-bottom-left-radius:7px;box-shadow:var(--shadow)}
.bub p{margin:.35em 0}.bub h3{margin:.7em 0 .25em}.bub ul,.bub ol{margin:.35em 0;padding-left:21px}
.err .bub{border-color:var(--error);color:var(--error)}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.acts button{width:auto;min-height:35px;margin:0;padding:7px 12px;font-size:11px;background:var(--soft);border:1px solid var(--border);border-radius:999px}
.tag{display:inline-block;margin-top:8px;padding:7px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--border);color:var(--accent);font-size:11px;font-weight:600}
.typing{display:inline-flex;gap:5px;padding:4px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
#cmp{position:fixed;left:0;right:0;bottom:calc(87px + env(safe-area-inset-bottom));z-index:15;padding:18px 14px 8px;background:linear-gradient(transparent,var(--bg) 35%)}
#cmp .composer{max-width:680px;margin:auto;display:flex;gap:9px;align-items:flex-end}
#cmp textarea{flex:1;min-width:0;max-height:130px;margin:0;resize:none;border-radius:19px;box-shadow:var(--shadow)}
#cmp button{margin:0}.chips,.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip,.filter{width:auto;min-height:41px;margin:0;padding:9px 14px;border:1px solid var(--border);border-radius:999px;color:var(--accent);font-size:12px}
.filter.active{background:var(--fill);color:var(--bubble-ink)}
.summary{background:radial-gradient(circle at 100% 0%,var(--glow),transparent 56%),var(--card)}
.summary-line{display:flex;align-items:center;justify-content:space-between;gap:18px}
.summary h2{margin:4px 0}.summary p{margin:4px 0}.summary-art{width:43px;height:43px;flex:none;color:var(--gold)}
.task{display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-height:65px;padding:12px 0;border-bottom:1px solid var(--border)}
.task:last-child{border:0}.task .ck{width:34px;height:34px;min-height:34px;flex:none;padding:0;margin:0;border:1.5px solid var(--gold);border-radius:50%;background:transparent;color:var(--accent)}
.task.done .ck{background:var(--fill);color:var(--bubble-ink)}
.task .tt{flex:1;min-width:0}.task.done .tt b{text-decoration:line-through;opacity:.68}
.task b{display:block;overflow-wrap:anywhere;font-size:13px;line-height:1.5}.task .x{width:42px;height:42px;min-height:42px;padding:0;margin:0;background:transparent;color:var(--mut);font-size:22px}
.late{color:var(--error);font-weight:700}
.progress-card{display:flex;align-items:center;gap:20px}.progress-ring{width:92px;height:92px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--progress),var(--soft) 0);position:relative}
.progress-ring:before{content:"";position:absolute;inset:9px;background:var(--card);border-radius:50%}.progress-ring strong{position:relative;font-size:20px}
.memory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.memory-item{margin:0;min-height:116px;padding:17px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.memory-item:before{left:17px}.memory-item p{margin:6px 0 0;overflow-wrap:anywhere;font-size:13px;line-height:1.6}
.memory-item .x{width:36px;height:36px;min-height:36px;margin:0;padding:0;flex:none;background:transparent;color:var(--mut);font-size:21px}
.empty{text-align:center;padding:32px 22px}.empty svg{width:70px;height:70px;margin:auto auto 12px;display:block;fill:none;stroke:var(--gold);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.empty p{max-width:340px;margin:9px auto}
.pan{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);overflow:auto}
.pan .card{width:100%;max-width:450px;padding:29px}
#toast{position:fixed;bottom:calc(171px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:90%;z-index:99;pointer-events:none;padding:11px 17px;border:1px solid var(--gold);border-radius:999px;background:var(--card);color:var(--ink);font-size:12px;text-align:center;opacity:0;transition:opacity .25s;box-shadow:var(--shadow)}
#toast.on{opacity:1}details summary{cursor:pointer;color:var(--accent);padding:5px 0}
#voiceBtn{border-radius:50%;background:var(--card);border:1px solid var(--gold);color:var(--accent)}
#voiceBtn.listening{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px var(--focus)}}
.confirm-row{display:flex;gap:8px;margin-top:8px;width:100%}.confirm-row button{flex:1}
#voiceStop{position:fixed;right:17px;bottom:calc(170px + env(safe-area-inset-bottom));z-index:30;width:auto;border:1px solid var(--gold);border-radius:999px;background:var(--fill);color:var(--bubble-ink)}
.choice-group{display:flex;flex-wrap:wrap;gap:8px}.choice-group button{width:auto;flex:1;min-width:90px;margin:0}.choice-group button.selected{border-color:var(--gold);background:var(--fill);color:var(--bubble-ink)}
.bub,.task b,.memory-item p{font-size:calc(14px*var(--fz,1))}.mut{font-size:calc(13px*var(--fz,1))}
.wave{max-width:680px;margin:0 auto 8px;display:flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;padding:0 6px}
.wave i{width:3px;height:8px;border-radius:2px;background:var(--gold);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
.wave span{margin-left:8px}@keyframes wv{50%{height:22px}}
.mood{display:flex;align-items:center;gap:13px;padding:15px 19px}.mood:before{left:19px}.mood-symbol{font-size:30px;color:var(--gold);line-height:1}.mood p{margin:0}.mood .eyebrow{margin:0 0 4px}
.priority-dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--gold);vertical-align:middle}.priority-dot.ordinary{background:var(--border)}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:15px 0}.week-strip button{margin:0;padding:7px 2px;min-width:0;min-height:59px;border:1px solid var(--border);background:var(--card);font-size:11px}.week-strip button strong{display:block;font-size:16px}.week-strip button.selected{background:var(--fill);color:var(--bubble-ink);border-color:var(--gold)}
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:90}.sparkles span{position:absolute;left:var(--x);top:var(--y);width:5px;height:5px;border-radius:50%;background:var(--gold);animation:scatter 1s ease-out forwards}@keyframes scatter{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@media(max-width:420px){.wrap{padding-left:15px;padding-right:15px}.memory-grid{grid-template-columns:1fr}.brand{font-size:26px}}
@media(max-width:380px){.row.fr{flex-direction:column;align-items:stretch;gap:0}}
@media(min-width:700px){.wrap{padding-top:31px}.card{padding:25px}#cmp{bottom:95px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="setup" class="pan hidden" aria-label="Setup">
 <div class="card">
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M14 7h20a8 8 0 0 1 8 8v13a8 8 0 0 1-8 8H23l-9 6.5V36a8 8 0 0 1-8-8V15a8 8 0 0 1 8-8z"/><path d="M17 28V17l7 7.5L31 17v11"/><path d="M42 1v5m-2.5-2.5h5"/></svg></span>Meri Assistant</div>
  <h1 style="margin-top:15px">Pehli dafa setup</h1>
  <p class="mut">Cloudflare Worker ka address aur apni app key yahan likhein (SETUP.md mein bataya gaya hai).</p>
  <label for="su">Worker address</label>
  <input id="su" placeholder="https://meri-assistant.xxxx.workers.dev" autocapitalize="off" autocorrect="off" inputmode="url">
  <label for="sk">App key</label>
  <input id="sk" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" aria-describedby="se">
  <p id="se" role="alert" class="subtle" style="min-height:1.4em"></p>
  <button type="button" id="sb" class="p" onclick="doSetup()">Jodein</button>
 </div>
</main>
<main id="lock" class="pan hidden" style="z-index:70" aria-label="App lock"><div class="card" style="text-align:center"><div class="brand" style="justify-content:center"><span class="mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M14 7h20a8 8 0 0 1 8 8v13a8 8 0 0 1-8 8H23l-9 6.5V36a8 8 0 0 1-8-8V15a8 8 0 0 1 8-8z"/><path d="M17 28V17l7 7.5L31 17v11"/><path d="M42 1v5m-2.5-2.5h5"/></svg></span>Meri Assistant</div><h2 style="margin-top:16px">App band hai</h2><p class="mut">Kholne ke liye apna PIN likhein.</p><label for="lockpin" class="sr-only">PIN</label><input id="lockpin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" style="text-align:center;letter-spacing:.4em;font-size:20px"><p id="lockerr" role="alert" class="subtle" style="min-height:1.4em"></p><button type="button" class="p" onclick="unlock()">Kholein</button></div></main>
<div id="app" class="wrap hidden">
 <header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M14 7h20a8 8 0 0 1 8 8v13a8 8 0 0 1-8 8H23l-9 6.5V36a8 8 0 0 1-8-8V15a8 8 0 0 1 8-8z"/><path d="M17 28V17l7 7.5L31 17v11"/><path d="M42 1v5m-2.5-2.5h5"/></svg></span>Meri Assistant</div>
  <button type="button" class="round" onclick="toggleTheme()" aria-label="Theme badlein" title="Theme badlein"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
 </header>
 <main><div id="strip"></div><div id="v"></div></main>
</div>
<div id="cmp" class="hidden">
 <div id="wave" class="wave hidden" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><span>Sun rahi hoon…</span></div>
 <div class="composer">

let cfg=J("as_cfg",null),msgs=J("as_msgs",[]),R={tasks:[],memory:[],subs:0,vapid:""},tab="chat",busy=false,ip=null,theme=J("as_theme","auto");

async function api(path,body){
 let r;try{r=await fetch(cfg.url.replace(/\/+$/,"")+path,{method:body?"POST":"GET",headers:{"x-app-key":cfg.key,"content-type":"application/json"},body:body?JSON.stringify({...body,tzOffset:-new Date().getTimezoneOffset()}):undefined,signal:AbortSignal.timeout(75000)})}catch(e){throw new Error(e.name==="TimeoutError"?"Bohat der lag gayi, dobara koshish karein":"Internet ya server tak nahi pahunch saki")}
 let j;try{j=await r.json()}catch(e){j={error:"Server ka jawab samajh nahi aaya ("+r.status+")"}}
 if(!r.ok||j.error)throw new Error(j.error||("Masla "+r.status));
 if(j.tasks){R.tasks=j.tasks;R.memory=j.memory;R.subs=j.subs;R.vapid=j.vapid;R.dh=j.dh}
 return j
}
function md(t){
 const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,!?]|$)/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
 let out="",list=null;const close=()=>{if(list){out+="</"+list+">";list=null}};
 for(const raw of String(t).split("\n")){const l=raw.trimEnd();let m;
  if(m=/^\s*[-*•]\s+(.*)/.exec(l)){if(list!=="ul"){close();out+="<ul>";list="ul"}out+="<li>"+inl(m[1])+"</li>"}
  else if(m=/^\s*\d+[.)]\s+(.*)/.exec(l)){if(list!=="ol"){close();out+="<ol>";list="ol"}out+="<li>"+inl(m[1])+"</li>"}
  else{close();if(m=/^#{1,4}\s+(.*)/.exec(l))out+="<h3>"+inl(m[1])+"</h3>";else if(l.trim())out+="<p>"+inl(l)+"</p>"}}
 close();return out
}
const IC={chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.4A8 8 0 1 1 21 12z"/>',task:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',mem:'<path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};

 $("#strip").innerHTML=(tab!=="task"&&(late||now)?`<button type="button" class="alert" onclick="go('task')"><span>${now?`Aaj ${now} kaam hai`:""}${now&&late?" · ":""}${late?`${late} kaam guzar chuka`:""}</span></button>`:"")+(off&&cfg?`<button type="button" class="card" style="width:100%;padding:13px 16px;margin:10px 0;text-align:left" onclick="go('set')"><span class="mut"><b>Alert abhi on nahi.</b> Settings mein "Alert on karein" dabayein, tab hi phone par yaad dihani aayegi.</span></button>`:"")
}

const SUG=["Kal subah 9 baje doctor ke paas jana hai","Meri Urdu ki assignment likh do: 'Mehnat ka phal'","Mujhe ye yaad rakhna: meri behan ka naam Sana hai","Aaj mere kaam kya hain?"];

 const tags=(m.added||[]).map(t=>`<span class="tag">✓ Kaam shaamil: ${esc(t.title)} · ${fd(t.date)}${t.time?" "+esc(t.time):""}</span>`).concat((m.rem||[]).map(t=>`<span class="tag">♡ Yaad rakh liya: ${esc(t)}</span>`)).join("<br>");

}

function vChat(){
 const td=today(),due=R.tasks.filter(t=>!t.done&&t.date===td).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
 const summary=`<section class="card summary" aria-label="Aaj ka khulasa"><div class="summary-line"><div><span class="eyebrow" style="margin:0">AAJ KA KHULASA</span><h2>${greeting()}${name?", "+esc(name):""}</h2><p class="mut">Aaj ${due.length} kaam ${due.length===1?"hai":"hain"} · ${due.length?"Agla kaam: "+esc(due[0].title):"Aaj ka din aap ka hai."}</p></div><svg class="summary-art ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg></div></section>`;
 const mood=`<section class="card mood" aria-label="Aaj ka mood"><span class="mood-symbol" aria-hidden="true">✦</span><div><span class="eyebrow">AAJ KA MOOD</span><p class="mut">${THOUGHTS[Math.floor(P(td).getTime()/864e5)%THOUGHTS.length]}</p></div></section>`;
 $("#v").innerHTML=summary+mood+`<div class="chips" aria-label="Jaldi shuru karein">${QUICK.map((s,i)=>`<button type="button" class="chip" onclick="quick(${i})">${s}</button>`).join("")}<button type="button" class="chip" onclick="toggleSearch()">${chatSearch?"Band karein":"Dhoondein"}</button></div>${chatSearch?`<input id="csearch" type="search" placeholder="Chat mein dhoondein…" value="${esc(chatQuery)}" oninput="chatFind(this.value)">`:""}<div id="msgs">${msgs.length?msgsHtml():`<section class="card empty">${illustration("chat")}<h1>Assalam o Alaikum 🌸</h1><p class="mut">Main aap ki assistant hoon. Mujhe apne kaam, tareekhein aur zaroori baatein batayein. Main unhein munazzam rakhne aur waqt par yaad dilane mein madad karungi.</p><div class="chips">${SUG.map((s,i)=>`<button type="button" class="chip" onclick="sug(${i})">${esc(s)}</button>`).join("")}</div></section>`}${busy?`<div class="msg ai" aria-label="Jawab aa raha hai"><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`:""}</div><div style="height:130px"></div>`
}

function msgsHtml(){const q=chatQuery.toLowerCase();const a=msgs.map((m,i)=>[m,i]).filter(([m])=>!q||String(m.text).toLowerCase().includes(q));return a.length?a.map(([m,i])=>bubble(m,i)).join(""):'<p class="mut">Koi paigham nahi mila.</p>'}
function chatFind(v){chatQuery=v;const e=$("#msgs");if(e)e.innerHTML=msgsHtml()}

async function rememberMsg(i,event){const m=msgs[i];if(!m||m.role!=="ai"||m.err)return;const b=event.currentTarget;b.disabled=true;try{await api("/api/memory",{add:m.text.slice(0,300)});toast("Yaad rakh liya ✓")}catch(e){toast(e.message)}finally{if(b.isConnected)b.disabled=false}}

async function send(){
 const el=$("#in"),text=el.value.trim();if(!text||busy)return;
 msgs.push({role:"user",text});el.value="";fit();busy=true;$("#send").disabled=true;W("as_msgs",msgs.slice(-120));draw();bottom();
 const hist=msgs.filter(m=>!m.err).slice(-24).map(m=>({role:m.role,text:m.text}));
 let spoken=null;
 try{const j=await api("/api/chat",{history:hist});msgs.push({role:"ai",text:j.reply,added:j.added,rem:j.remembered});spoken=j.reply;if(j.added&&j.added.length)toast("Kaam shaamil ho gaya ✓")}
 catch(e){msgs.push({role:"ai",text:"Maazrat, jawab nahi aaya: "+e.message,err:1})}
 busy=false;$("#send").disabled=false;msgs=msgs.slice(-120);W("as_msgs",msgs);draw();bottom();
 if(spoken&&vget("reply",false))speakText(spoken)
}

function dl(i){
 const h=`<html><head><meta charset="utf-8"><title>Meri Assistant</title></head><body style="font-family:Calibri,Arial;font-size:12pt">${md(msgs[i].text)}</body></html>`;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff",h],{type:"application/msword"}));a.download="assistant-"+today()+".doc";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast("Download shuru")
}
function chooseWeek(d){weekDate=weekDate===d?"":d;vTask()}
function isImportant(t){return /zaroori|urgent|important|priority/i.test(String(t.title||""))}
function celebrate(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const box=document.createElement("div");box.className="sparkles";for(let i=0;i<17;i++){const p=document.createElement("span");p.style.setProperty("--x",45+Math.random()*10+"%");p.style.setProperty("--y",35+Math.random()*15+"%");p.style.setProperty("--dx",(Math.random()-.5)*240+"px");p.style.setProperty("--dy",(Math.random()-.5)*230+"px");box.appendChild(p)}document.body.appendChild(box);setTimeout(()=>box.remove(),1100)}
function setTaskFilter(k){taskFilter=k;vTask()}
function vTask(){
 const td=today(),all=R.tasks||[],todayTasks=all.filter(t=>t.date===td),completed=todayTasks.filter(t=>t.done).length,overall=todayTasks.length;
 const filtered=all.filter(t=>(taskFilter==="all"||taskFilter==="today"&&t.date===td||taskFilter==="pending"&&!t.done||taskFilter==="done"&&t.done)&&(!weekDate||t.date===weekDate));
 const by={late:[],today:[],tom:[],week:[],later:[],done:[]};
 [...filtered].sort((a,b)=>(a.date+(a.time||"99:99")).localeCompare(b.date+(b.time||"99:99"))).forEach(t=>{const d=dd(td,t.date);(t.done?by.done:d<0?by.late:d===0?by.today:d===1?by.tom:d<=7?by.week:by.later).push(t)});
 const row=t=>`<div class="task${t.done?" done":""}" data-id="${esc(t.id)}"><button type="button" class="ck" onclick="tdone('${esc(t.id)}',${!t.done})" aria-label="${t.done?"Kaam dobara kholein":"Mukammal karein"}">${t.done?"✓":""}</button><div class="tt"><b><span class="priority-dot ${isImportant(t)?"":"ordinary"}" aria-label="${isImportant(t)?"Zaroori":"Aam"}"></span>${esc(t.title)}</b><span class="mut ${!t.done&&t.date<td?"late":""}">${fd(t.date)}${t.time?" · "+esc(t.time):""}</span></div><button type="button" class="x" onclick="trm('${esc(t.id)}')" aria-label="Kaam hata dein">×</button></div>`;
 const sec=(n,a,c)=>a.length?`<section class="card"><h2 ${c?`class="late"`:""}>${n}</h2>${a.map(row).join("")}</section>`:"";
 const filters=[["all","Sab"],["today","Aaj"],["pending","Baqi"],["done","Mukammal"]];
 const week=Array.from({length:7},(_,i)=>{const d=P(td);d.setDate(d.getDate()+i);const date=iso(d);return `<button type="button" class="${weekDate===date?"selected":""}" aria-pressed="${weekDate===date}" aria-label="${fd(date)} ke kaam" onclick="chooseWeek('${date}')">${DAYS[d.getDay()].slice(0,3)}<strong>${d.getDate()}</strong></button>`}).join("");
 $("#v").innerHTML=`<span class="eyebrow">AAPKE KAAM</span><h1>Kaam aur tareekhein</h1><section class="card progress-card"><div class="progress-ring" style="--progress:${overall?Math.round(completed/overall*100):0}%" role="img" aria-label="Aaj ${overall} mein se ${completed} kaam mukammal"><strong>${completed}/${overall}</strong></div><div><h2>Aaj ki peshraft</h2><p class="mut">Aaj ke mukammal kaam</p></div></section><div class="week-strip" role="group" aria-label="Aane wale saat din">${week}</div><div class="filters" role="group" aria-label="Kaam filter">${filters.map(([k,n])=>`<button type="button" class="filter ${taskFilter===k?"active":""}" aria-pressed="${taskFilter===k}" onclick="setTaskFilter('${k}')">${n}</button>`).join("")}</div>${!filtered.length?`<section class="card empty">${illustration("task")}<h2>${all.length?"Is filter mein koi kaam nahi":"Abhi koi kaam nahi"}</h2><p class="mut">Neeche se shaamil karein ya "Baat" mein assistant ko bata dein.</p></section>`:""}${sec("Guzar chuke",by.late,1)}${sec("Aaj",by.today)}${sec("Kal",by.tom)}${sec("Is hafte",by.week)}${sec("Baad mein",by.later)}
 <section class="card"><h2>Naya kaam</h2><label for="nt">Kaam</label><input id="nt" maxlength="200" placeholder="jaise: Assignment jama karani hai"><div class="row fr"><div><label for="nd">Tareekh</label><input id="nd" type="date" value="${td}"></div><div><label for="ntm">Waqt (optional)</label><input id="ntm" type="time"></div></div><button type="button" class="p" onclick="tadd(event)">Shaamil karein</button></section>${by.done.length?`<details class="card" ${taskFilter==="done"?"open":""}><summary><b>Mukammal (${by.done.length})</b></summary>${by.done.map(row).join("")}</details>`:""}`
}
async function tadd(event){const title=$("#nt").value.trim(),date=$("#nd").value;if(!title||!date){toast("Kaam aur tareekh likhein");return}const b=event.currentTarget;b.disabled=true;try{await api("/api/task",{title,date,time:$("#ntm").value||""});toast("Shaamil ho gaya ✓");draw()}catch(e){toast(e.message)}finally{b.disabled=false}}

const u8=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function enablePush(){
 if(!("serviceWorker"in navigator)||!("PushManager"in window)||!("Notification"in window)){toast("Is browser mein alert support nahi");return}
 try{const p=await Notification.requestPermission();if(p!=="granted"){toast("Alert ki ijazat nahi di gayi");return}
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(sub){const k=sub.options&&sub.options.applicationServerKey;if(k&&btoa(String.fromCharCode(...new Uint8Array(k))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")!==R.vapid){await sub.unsubscribe();sub=null}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(R.vapid)});
  await api("/api/subscribe",{sub:sub.toJSON()});toast("Alert on ho gaye ✓");draw()}catch(e){toast("Masla: "+e.message)}
}

function vSet(){
 const perm="Notification"in window?Notification.permission:"na";
 $("#v").innerHTML=`<span class="eyebrow">AAPKI MARZI</span><h1>Settings</h1>
 <section class="card"><h2>Aapka naam</h2><label for="greetingName">Greeting ka naam</label><input id="greetingName" maxlength="40" autocomplete="nickname" placeholder="Aapka naam" value="${esc(name)}" onchange="saveName(this.value)"><p class="mut">Naam is phone par mehfooz rahega aur aaj ke khulase mein nazar aayega.</p></section>

 <section class="card voice-settings"><h2>Awaaz</h2>
 <label for="voiceLang">Bolne ki zubaan</label><select id="voiceLang" onchange="voiceSave('lang',this.value)"><option value="ur-PK">Urdu (Pakistan)</option><option value="en-IN">English (India)</option><option value="auto">Auto</option></select>
 <label class="checklabel" for="voiceAuto"><input id="voiceAuto" type="checkbox" onchange="voiceSave('auto',this.checked)"> Bolne ke baad khud bhejein</label>
 <label class="checklabel" for="voiceReply"><input id="voiceReply" type="checkbox" onchange="voiceSave('reply',this.checked)"> Jawab awaz mein sunayein</label>

 <section class="card"><h2>Alert</h2><p class="mut">${perm==="granted"?(R.subs?"Is phone par alert on hain ✓":"Ijazat mil gayi, lekin phone abhi juda nahi. Neeche button dabayein."):perm==="denied"?"Alert blocked hain. Chrome ke site settings mein Notifications allow karein.":"Alert abhi on nahi."}</p><button type="button" class="p" onclick="enablePush()">${R.subs?"Alert dobara jodein":"Alert on karein"}</button><button type="button" onclick="testPush()">Test alert bhejein</button>
 <label for="dh" style="margin-top:19px">Subah ka khulasa (aaj ke kaam) kitne baje</label><select id="dh" onchange="setDigest(this.value)">${[6,7,8,9,10].map(h=>`<option value="${h}" ${h===(R.dh||8)?"selected":""}>${h}:00 AM</option>`).join("")}</select></section>
 <section class="card"><h2>Install</h2>${ip?`<button type="button" class="p" onclick="ip.prompt()">App install karein</button>`:`<p class="mut">Chrome menu ⋮ → Add to Home screen / Install app. Alert ke liye install karna behtar hai.</p>`}</section>
 <section class="card"><h2>Privacy</h2>${lockOn()?`<p class="mut">App lock on hai ✓ Phone mein wapas aane par PIN poocha jayega.</p><button type="button" class="d" onclick="clearPin()">App lock band karein</button>`:`<p class="mut">4 se 6 ankon ka PIN lagayein, taake koi aur app na khol sake.</p><label for="newpin">Naya PIN</label><input id="newpin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><button type="button" class="p" onclick="setPin()">PIN lagayein</button>`}</section>
 <section class="card"><h2>Mehfooz</h2><button type="button" onclick="expChat()">Baat-cheet export karein</button><button type="button" onclick="showConfirm('clear-chat','Baat-cheet saaf karein? (kaam aur yaad mehfooz rahenge)',clearChat)">Baat-cheet saaf karein</button><div id="confirm-clear-chat"></div></section>
 <section class="card"><h2>Connection</h2><p class="mut">${esc(cfg.url)}</p><button type="button" class="d" onclick="showConfirm('disconnect','Is phone se connection hata dein?',disconnect)">Connection hatayein</button><div id="confirm-disconnect"></div></section>
 <p class="mut">Ye app aap ke WhatsApp ya calls nahi dekh sakti. Baat-cheet is phone ke browser mein, aur kaam/yaadasht aap ke apne Cloudflare account mein rehti hain.</p>`
}
function showConfirm(id,message,action){
 const host=id.startsWith("task-")?document.querySelector('.task[data-id="'+id.slice(5)+'"]'):document.getElementById("confirm-"+id);
 if(!host)return;
 const previous=host.querySelector(".confirm-row");if(previous)previous.remove();
 const box=document.createElement("div");box.className="confirm-row";box.setAttribute("role","group");box.setAttribute("aria-label",message);
 const yes=document.createElement("button"),no=document.createElement("button");
 yes.type="button";no.type="button";yes.className="d";yes.textContent="Haan, hata dein";no.textContent="Nahi";
 yes.onclick=async()=>{yes.disabled=true;try{await action()}finally{box.remove()}};
 no.onclick=()=>box.remove();box.append(yes,no);host.appendChild(box);no.focus()
}
function clearChat(){msgs=[];W("as_msgs",[]);go("chat")}
function disconnect(){
 localStorage.removeItem("as_cfg");cfg=null;R={tasks:[],memory:[],subs:0,vapid:""};
 $("#app").classList.add("hidden");$("#nav").classList.add("hidden");$("#cmp").classList.add("hidden");$("#sk").value="";$("#setup").classList.remove("hidden")
}
async function setDigest(h){try{const j=await api("/api/settings",{digestHour:+h});R.dh=j.digestHour;toast("Mehfooz ✓")}catch(e){toast(e.message)}}
function expChat(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(msgs,null,2)],{type:"application/json"}));a.download="assistant-chat-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
async function doSetup(){
 const url=$("#su").value.trim(),key=$("#sk").value.trim();$("#se").textContent="";
 if(!/^https:\/\/\S+$/.test(url)||!key){$("#se").textContent="Address (https://…) aur key dono likhein";return}
 cfg={url,key};const b=$("#sb");b.disabled=true;b.textContent="Jaanch rahi hai…";
 try{await api("/api/state");W("as_cfg",cfg);$("#setup").classList.add("hidden");start()}catch(e){cfg=null;$("#se").textContent=e.message==="Failed to fetch"?"Worker tak nahi pahunch saka, address check karein":e.message}
 b.disabled=false;b.textContent="Jodein"
}
async function start(){
 $("#app").classList.remove("hidden");$("#nav").classList.remove("hidden");draw();
 try{await api("/api/state");draw()}catch(e){toast(e.message)}resync()
}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&cfg)api("/api/state").then(()=>{if(tab!=="chat"||!busy)draw()}).catch(()=>{})});
$("#in").addEventListener("input",fit);
$("#in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();send()}});
const LKEY="ma_lock";let hiddenAt=0;
async function lhash(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ma:"+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return "p:"+btoa(p)}}
function lockOn(){return !!J(LKEY,null)}
function showLock(){if(!lockOn())return false;$("#lockpin").value="";$("#lockerr").textContent="";$("#lock").classList.remove("hidden");setTimeout(()=>{const e=$("#lockpin");if(e)e.focus()},60);return true}
async function unlock(){const p=$("#lockpin").value.trim();if(await lhash(p)===J(LKEY,null)){$("#lock").classList.add("hidden")}else{$("#lockerr").textContent="PIN theek nahi";$("#lockpin").value=""}}
async function setPin(){const e=$("#newpin"),p=e?e.value.trim():"";if(!/^\d{4,6}$/.test(p)){toast("4 se 6 ankon ka PIN likhein");return}W(LKEY,await lhash(p));toast("App lock on ✓");draw()}
function clearPin(){W(LKEY,null);toast("App lock band");draw()}
function waveOn(x){const w=document.getElementById("wave");if(w)w.classList.toggle("hidden",!x)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(lockOn()&&hiddenAt&&Date.now()-hiddenAt>30000)showLock()});
$("#lockpin").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
// ---------- voice ----------
const VKEY={lang:"ma_voice_lang",auto:"ma_voice_auto_send",reply:"ma_voice_reply",rate:"ma_voice_rate",voice:"ma_voice_choice"};
let vr=null,vl=false,vs=!!(window.SpeechRecognition||window.webkitSpeechRecognition),tts=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
function vget(k,d){try{const x=localStorage.getItem(VKEY[k]);return x===null?d:JSON.parse(x)}catch(e){return d}}
function voiceSave(k,v){try{localStorage.setItem(VKEY[k],JSON.stringify(v))}catch(e){}}
function vlang(){let x=vget("lang","ur-PK");return x==="auto"?(navigator.language||"ur-PK"):x}
function vpopulate(){
 let e=document.getElementById("voiceChoice");if(!e||!tts)return;
 let chosen=vget("voice","");e.innerHTML='<option value="">Default voice</option>'+speechSynthesis.getVoices().map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("");e.value=chosen
}
function vsettings(){
 let set=(id,v)=>{let e=document.getElementById(id);if(e)e.value=v},check=(id,v)=>{let e=document.getElementById(id);if(e)e.checked=!!v};
 set("voiceLang",vget("lang","ur-PK"));check("voiceAuto",vget("auto",false));check("voiceReply",vget("reply",false));set("voiceRate",vget("rate",1));
 let r=document.getElementById("voiceRateVal");if(r)r.textContent=(+vget("rate",1)).toFixed(1)+"×";vpopulate()
}
function toggleVoice(){
 if(!vs){toast("Is browser mein mic support nahi karta");return}
 if(vl){try{vr.stop()}catch(e){}return}
 let C=window.SpeechRecognition||window.webkitSpeechRecognition;vr=new C();vr.lang=vlang();vr.interimResults=true;let final="";
 vr.onstart=()=>{vl=true;waveOn(true);document.getElementById("voiceBtn")?.classList.add("listening");toast("Sun rahi hoon…")};
 vr.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t}let el=document.getElementById("in");if(el){el.value=(final+interim).trim();fit()}};
 vr.onerror=e=>{vl=false;waveOn(false);document.getElementById("voiceBtn")?.classList.remove("listening");toast(["not-allowed","service-not-allowed"].includes(e.error)?"Mic ki ijazat nahi mili. Browser settings mein microphone allow karein.":"Mic mein masla hua. Dobara koshish karein.")};
 vr.onend=()=>{vl=false;waveOn(false);document.getElementById("voiceBtn")?.classList.remove("listening");let el=document.getElementById("in");if(el&&final.trim()){el.value=final.trim();fit();if(vget("auto",false))send()}};
 try{vr.start()}catch(e){toast("Mic shuru nahi ho saka. Dobara koshish karein.")}
}
function vclean(t){return String(t||"").replace(/```[\s\S]*?```/g," ").replace(/`([^`]+)`/g,"$1").replace(/^\s{0,3}#{1,6}\s+/gm,"").replace(/^\s*[-*+]\s+/gm,"").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/[*_~>#]/g,"").replace(/\s+/g," ").trim()}
function speakText(t){
 if(!tts){toast("Is browser mein awaz support nahi karta");return}
 let text=vclean(t);if(!text)return;speechSynthesis.cancel();
 let stop=document.getElementById("voiceStop");if(stop)stop.classList.remove("hidden");
 let u=new SpeechSynthesisUtterance(text);u.lang=vlang();u.rate=+vget("rate",1)||1;
 let v=speechSynthesis.getVoices().find(x=>x.voiceURI===vget("voice",""));if(v)u.voice=v;
 u.onend=u.onerror=()=>{if(stop)stop.classList.add("hidden")};speechSynthesis.speak(u)
}
function speakMsg(i){if(msgs[i]&&msgs[i].role==="ai"&&!msgs[i].err)speakText(msgs[i].text)}
function stopVoice(){if(tts)speechSynthesis.cancel();if(vl&&vr)try{vr.stop()}catch(e){}let b=document.getElementById("voiceStop");if(b)b.classList.add("hidden");toast("Awaz rok di")}
function voiceInit(){
 let b=document.getElementById("voiceBtn");if(!vs&&b)b.classList.add("hidden");
 if(tts){speechSynthesis.onvoiceschanged=vpopulate;vpopulate()}
}

showLock();
if(cfg&&cfg.url&&cfg.key)start();else $("#setup").classList.remove("hidden");
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});

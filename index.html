<!doctype html>
<html lang="ur" dir="auto">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#07132f"><meta name="description" content="Meri Assistant — aap ka rozana madadgaar."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./favicon.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Meri Assistant — Aap ka rozana saathi</title>
<style>

:root{
 --bg:#f1f6fd;--surface:#ffffff;--surface-2:#f4f8fe;--ink:#0b1f5c;--muted:#66779a;
 --line:#e0e8f5;--green:var(--accent);--green-2:#0b43b8;--mint:#e3efff;--coral:#e97858;
 --gold:#e8b75d;--wash:#edf6ff;--shadow:0 14px 38px rgba(21,46,98,.10);
 --accent:#1e5be0;--on-ink:#ffffff;--ink-soft:#cbd8fa;--radius:22px;
 --font:15px;color-scheme:light
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:var(--font)}
body{min-height:100dvh}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent),transparent 55%);outline-offset:3px}
button:disabled{opacity:.55;cursor:not-allowed}
.app{min-height:100dvh}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh;max-width:1600px;margin:auto}
.sidebar{position:sticky;top:0;height:100dvh;padding:27px 17px 20px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px;z-index:5}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;font-weight:850;font-size:17px;letter-spacing:-.7px}
.brand img{width:43px;height:43px;object-fit:contain;border-radius:14px}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.1px;margin-top:3px}
.nav{display:grid;gap:6px}
.nav button{border:0;background:transparent;display:flex;gap:13px;align-items:center;padding:12px 14px;border-radius:14px;color:var(--muted);font-weight:700;text-align:left;min-height:48px;transition:background .18s,color .18s,transform .18s}
.nav button:hover{background:var(--surface-2);color:var(--ink);transform:translateX(2px)}
.nav button.active{background:var(--green);color:#fffdf8;box-shadow:0 7px 16px #10347226}
.nav .glyph{font-size:18px;width:24px;text-align:center}
.side-foot{margin-top:auto;color:var(--muted);font-size:11px;padding:13px 10px;border-top:1px solid var(--line);line-height:1.6}
.main{min-width:0;display:flex;flex-direction:column;height:100dvh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:19px clamp(18px,4vw,52px);gap:12px;background:var(--bg);position:relative;z-index:2}
.topbar h1{font-size:21px;margin:0;letter-spacing:-.7px;font-weight:850}
.top-right{display:flex;align-items:center;gap:10px}
.status{font-size:11px;color:#103472;background:#d9e2f2;padding:8px 12px;border-radius:99px;font-weight:800}
.status.off{color:#88540a;background:#fff0d4}
.avatar{width:40px;height:40px;border-radius:14px;background:var(--green);color:#fff;border:0;font-weight:850;box-shadow:0 5px 14px #10347226}
.view{display:none;overflow:auto;flex:1;padding:0 clamp(18px,4vw,52px) calc(30px + env(safe-area-inset-bottom))}
.view.active{display:block}
.view-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 18px}
.view-title h2{font-size:22px;margin:0;letter-spacing:-.8px;font-weight:850}
.welcome{border-radius:26px;background:var(--green);padding:27px;color:#fffdf8;position:relative;overflow:hidden;box-shadow:0 18px 40px #10347220}
.welcome:after{content:'✳';position:absolute;right:25px;top:10px;font-size:66px;color:#ffffff22}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;opacity:.75;font-weight:850}
.welcome h2{font-size:clamp(24px,3vw,34px);line-height:1.18;margin:10px 0}
.welcome p{margin:0;opacity:.82;font-size:13px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.panel h3{font-size:14px;margin:0;font-weight:850}
.quiet{color:var(--muted);font-size:12px}
.ring-wrap{display:flex;align-items:center;gap:17px}
.ring{width:76px;height:76px;flex:0 0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring strong{position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
.ring-copy b{font-size:20px;display:block}
.ring-copy span{font-size:12px;color:var(--muted)}
.next-task{display:flex;gap:12px;align-items:center}
.mini-check{width:42px;height:42px;border:1px solid #cbd5e6;border-radius:14px;background:var(--wash);color:var(--green);font-size:18px}
.primary{border:0;color:#fffdf8;background:var(--green);border-radius:13px;padding:12px 17px;font-weight:800;box-shadow:0 7px 18px #10347222;min-height:44px;transition:transform .16s,background .16s}
.primary:hover{background:var(--green-2);transform:translateY(-1px)}
.soft{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;padding:10px 13px;font-weight:750;min-height:42px}
.soft:hover{background:var(--surface-2)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #d6dde9;background:#ecf0f6;color:#1d3763;border-radius:99px;padding:9px 13px;font-size:12px;font-weight:750;min-height:38px}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.chat-layout{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(360px,1.1fr);align-items:stretch;gap:18px;min-height:calc(100dvh - 100px)}
.home-dashboard{min-width:0;display:flex;flex-direction:column;gap:13px;padding-bottom:18px}
.hero-card{min-height:238px;border-radius:27px;background:linear-gradient(125deg,#0b2a78 0%,#1e5be0 62%,#5b4cf0 150%);color:#fffdf8;padding:25px 23px;position:relative;overflow:hidden;display:flex;align-items:center;isolation:isolate;box-shadow:0 18px 42px #122a5428}
.hero-card:before{content:"";position:absolute;width:270px;height:270px;border:1px solid #ffffff25;border-radius:50%;right:-80px;top:-95px;box-shadow:0 0 0 24px #ffffff09,0 0 0 50px #ffffff07;z-index:-1}
.hero-copy{position:relative;z-index:2;max-width:68%}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:9px;letter-spacing:1.8px;font-weight:850;color:#d1def5}
.hero-kicker i{width:7px;height:7px;border-radius:50%;background:#f3c66d;box-shadow:0 0 0 5px #f3c66d25}
.hero-copy h2{font-size:clamp(23px,2.7vw,31px);line-height:1.14;letter-spacing:-1px;margin:14px 0 9px}
.hero-copy p{font-size:12px;line-height:1.65;color:#e0e6f0;max-width:290px;margin:0}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
.hero-btn{border:0;border-radius:12px;background:#eaf4ff;color:#0b2a78;padding:10px 13px;font-weight:850;font-size:11px;min-height:40px}
.hero-btn.ghost{background:#ffffff15;color:#fff;border:1px solid #ffffff45}
.hero-glow{position:absolute;width:170px;height:170px;border-radius:50%;background:#f3c66d22;filter:blur(5px);right:5%;bottom:-85px;z-index:-1}
.home-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0}
.stat-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;font-size:17px;font-weight:900;flex:0 0 auto}
.stat-icon.blue{background:#dfe6f2;color:#103472}.stat-icon.amber{background:#fff0d7;color:#a86612}
.stat-card span{display:block;color:var(--muted);font-size:10px;font-weight:650}
.stat-card strong{display:block;font-size:23px;line-height:1.25;letter-spacing:-.8px}
.stat-card strong small{font-size:13px;color:var(--muted);font-weight:650}
.stat-card em{font-style:normal;font-size:10px;color:var(--muted)}
.weekly-card{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:16px 17px;box-shadow:var(--shadow)}
.weekly-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.weekly-top b{display:block;font-size:13px;font-weight:850}
.weekly-top small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.weekly-top>span{font-size:10px;font-weight:900;letter-spacing:1px;color:var(--green)}
.week-bars{height:98px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;margin-top:13px}
.week-bar{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.week-bar strong{font-size:9px;color:var(--muted);font-weight:750}
.week-bar i{width:min(22px,72%);height:var(--bar-height);min-height:5px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#39bfff,#1e5be0);display:block;transition:height .35s}
.week-bar span{font-size:9px;color:var(--muted)}
.assistant-strip{display:flex;align-items:center;gap:10px;padding:4px 3px}
.assistant-mini{width:43px;height:43px;border-radius:15px;background:#e3e8f0;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.assistant-strip b{font-size:12px;display:block}
.assistant-strip small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.online-dot{margin-left:auto;color:#103472;background:#d9e2f2;padding:7px 10px;border-radius:99px;font-size:10px;font-weight:850}
.prompt-row{margin-top:-3px}
.chat-panel{min-height:560px;max-height:calc(100dvh - 104px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.chat-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat-panel-head b{font-size:14px;display:block}
.chat-panel-head small{display:block;font-size:10px;color:var(--muted);margin-top:4px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-tools{display:flex;gap:6px}
.chat-tools .soft{width:38px;height:38px;min-height:38px;padding:0;font-size:17px}
.chat-scroll{flex:1;min-height:140px;overflow:auto;padding:17px 15px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.bubble{max-width:min(88%,680px);border-radius:17px;padding:12px 14px;line-height:1.65;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--ink)}
.bubble.user{align-self:flex-end;background:var(--green);color:#fffdf8;border-bottom-right-radius:5px}
.msg-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.msg-actions button{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:10px;padding:6px 8px;border-radius:8px;min-height:30px}
.bubble.user .msg-actions button{background:#ffffff18;border-color:#ffffff55;color:#fff}
.msg-chips{display:flex;gap:6px;margin-top:8px}
.msg-chips span{font-size:10px;background:#d9e2f2;color:#103472;border-radius:9px;padding:5px 8px}
.composer{display:flex;gap:8px;align-items:flex-end;margin:0 12px 9px;border:1px solid #d5dbe4;background:var(--surface);padding:7px;border-radius:17px;box-shadow:0 5px 20px #17376b0b}
.composer textarea{resize:none;border:0;outline:0;flex:1;min-width:0;min-height:43px;max-height:125px;padding:11px 9px;background:transparent;color:var(--ink);font-size:12px}
.icon-btn{width:42px;height:42px;border:0;border-radius:13px;background:#e8edf4;color:var(--green);font-size:17px;flex:0 0 auto}
.icon-btn.send{background:var(--green);color:#fff}
.composer-hint{padding:0 16px 12px;color:var(--muted);font-size:9px}
.task-progress{background:var(--wash);border-radius:99px;height:8px;overflow:hidden;margin:13px 0}
.task-progress i{display:block;height:100%;background:linear-gradient(90deg,#39bfff,#2877f0);border-radius:99px;width:0;transition:width .3s}
.task-list{display:grid;gap:9px}
.task-card{display:flex;gap:11px;align-items:center;padding:13px;border:1px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);touch-action:pan-y}
.task-check{width:27px;height:27px;border:2px solid #b3bdce;background:transparent;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;color:white}
.task-card.done .task-check{background:var(--accent);border-color:var(--accent)}
.task-card.done .task-name{text-decoration:line-through;color:var(--muted)}
.task-meta{min-width:0;flex:1}
.task-name{font-size:13px;font-weight:750;overflow-wrap:anywhere}
.task-sub{font-size:10px;color:var(--muted);margin-top:4px}
.badge-pri{display:inline-block;margin-left:7px;padding:3px 6px;border-radius:6px;background:#fff0d7;color:#985b0d;font-size:9px}
.delete-btn{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:10px;font-size:16px;min-width:38px;min-height:38px}
.delete-btn:hover{background:var(--surface-2);color:var(--coral)}
.section-label{font-size:11px;color:var(--muted);font-weight:850;letter-spacing:.5px;margin:19px 2px 9px}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:15px}
.daypill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;text-align:center;padding:9px 2px;min-height:65px}
.daypill b{display:block;font-size:14px}
.daypill small{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}
.daypill.active{background:var(--green);color:#fffdf8;border-color:var(--green)}
.daypill.active small{color:#dfe5f0}
.field{width:100%;border:1px solid #d5dae2;border-radius:12px;background:var(--surface);padding:12px;color:var(--ink);min-height:45px}
.field::placeholder{color:#828da1}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid .wide{grid-column:1/-1}
.memory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.memory-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px;display:flex;gap:10px;box-shadow:var(--shadow)}
.memory-card p{font-size:13px;line-height:1.6;margin:0;flex:1;overflow-wrap:anywhere}
.memory-actions{display:flex;align-items:flex-start;gap:2px}
.search{position:relative;margin-bottom:14px}
.search input{padding-left:42px}
.search:before{content:'⌕';position:absolute;left:15px;top:5px;font-size:24px;color:var(--muted)}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calendar-head strong{font-size:17px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calweekday{text-align:center;font-size:10px;color:var(--muted);font-weight:800;padding:6px 0}
.calday{min-height:57px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.calday b{font-size:13px}.calday small{font-size:9px;color:var(--muted)}
.calday.today{border-color:var(--coral)}.calday.selected{background:var(--green);border-color:var(--green);color:#fff}.calday.selected small{color:#dfe5f0}
.calday.has-task:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--coral)}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.setting{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);min-width:0}
.setting h3{font-size:14px;margin:0 0 13px;font-weight:850}
.setting label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin:10px 0 6px}
.setting p{font-size:11px;line-height:1.55;color:var(--muted)}
.color-row{display:flex;gap:9px;margin-top:10px}
.swatch{width:29px;height:29px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line)}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.empty .sparkle{display:block;font-size:25px;color:var(--coral);margin-bottom:7px}
.bottomnav{display:none}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#13233f;color:#fffdf8;border:1px solid #3e557c;padding:12px 16px;border-radius:13px;box-shadow:0 12px 35px #0e152033;font-size:12px;max-width:min(92vw,500px)}
.toast button{margin-left:12px;border:0;background:#f2e6cf;color:#1f2d44;padding:6px 10px;border-radius:8px;font-weight:800}
.modal-back{position:fixed;inset:0;z-index:40;background:#101826cc;display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px)}
.modal{width:min(100%,470px);max-height:88dvh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 25px 70px #0004}
.modal h2{font-size:19px;margin:0 0 18px}
.modal .field{margin:5px 0 12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.lockscreen{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 10%,#d9e0ed,transparent 35%),var(--bg)}
.lockcard{width:min(100%,410px);background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 20px 70px #141d2e18}
.lockcard img{width:74px;height:74px;object-fit:contain;border-radius:20px;margin-bottom:10px}
.lockcard h1{font-size:25px;margin:4px 0 8px;letter-spacing:-1px}
.lockcard p{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 18px}
.lockcard label{display:block;margin:12px 0 6px}
.lockcard .primary{width:100%;margin-top:12px}
.opening-overlay{position:fixed;inset:0;z-index:50;background:#eaedf3f2;display:grid;place-items:center;animation:overlayOut .45s ease 1.65s forwards}
.opening-inner{display:flex;flex-direction:column;align-items:center;gap:8px;color:#13233f;font-weight:850;animation:popIn .55s cubic-bezier(.2,.8,.2,1)}
.opening-inner small{font-size:11px;color:#5f6b80;font-weight:600}
@keyframes overlayOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.mascot{width:130px;height:142px;position:relative;flex:0 0 130px;isolation:isolate;animation:mascot-bob 4s ease-in-out infinite}.mascot-aura{position:absolute;width:116px;height:116px;left:7px;top:15px;border-radius:50%;background:radial-gradient(circle,#8bdfff40,transparent 70%);filter:blur(3px)}
.mascot-antenna{position:absolute;z-index:1;left:62px;top:2px;width:6px;height:18px;background:linear-gradient(#c7e9ff,#fff);border-radius:8px}.mascot-antenna i{position:absolute;left:-4px;top:-5px;width:14px;height:14px;border-radius:50%;background:#62dfff;box-shadow:0 0 12px #55cfff}
.mascot-ear{position:absolute;top:45px;width:15px;height:30px;border:3px solid #c9d8ed;background:linear-gradient(140deg,#fff,#9eb6d1);border-radius:8px;z-index:2}.mascot-ear.left{left:8px}.mascot-ear.right{right:8px}
.mascot-head{position:absolute;z-index:3;left:19px;top:23px;width:92px;height:76px;border:3px solid #c5d7ec;border-radius:29px 29px 24px 24px;background:linear-gradient(145deg,#fff 8%,#e8f1fa 55%,#a9c0d8);box-shadow:inset 0 -7px 0 #b7cbe0,0 9px 16px #061b4738}
.mascot-glass{position:absolute;inset:10px 9px 12px;border-radius:18px;background:linear-gradient(145deg,#06152e,#102d54);box-shadow:inset 0 1px 8px #4d9bda55;display:flex;align-items:center;justify-content:center;gap:19px}
.mascot-eye{width:11px;height:14px;border-radius:50%;background:#75eaff;box-shadow:0 0 7px #5de5ff,0 0 16px #32baff;animation:mascot-blink 5s infinite}

function toast(msg,undo){clearTimeout(toastTimer);$('#toastroot').innerHTML=`<div class="toast">${esc(msg)}${undo?'<button id="undo">Wapas</button>':''}</div>`;if(undo)$('#undo').onclick=()=>{undo();$('#toastroot').innerHTML=''};toastTimer=setTimeout(()=>$('#toastroot').innerHTML='',4300)}
async function api(path,body){if(!cfg?.url||!cfg?.key)throw Error('Pehle backend setup karein.');let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),75000);try{let url=cfg.url.replace(/\/$/,'');let r=await fetch(url+path,{method:body?'POST':'GET',headers:{'x-app-key':cfg.key,'content-type':'application/json'},body:body?JSON.stringify({...body,tzOffset:-new Date().getTimezoneOffset()}):undefined,signal:ctrl.signal});if(!r.ok)throw Error(`Server masla (${r.status})`);return await r.json()}finally{clearTimeout(timer)}}
async function refresh(){try{let s=await api('/api/state');tasks=Array.isArray(s.tasks)?s.tasks:[];memory=Array.isArray(s.memory)?s.memory:[];window.maVapid=s.vapid;window.maSubs=s.subs;window.maDh=s.dh;render();}catch(e){toast(e.message||'Data load nahi hua.')}}
function rootNav(){return tabs.map(([t,ic])=>`<button data-tab="${t}" class="${active===t?'active':''}" aria-label="${t}"><span class="glyph">${ic}</span>${t}</button>`).join('')}

function dashboard(){let td=tasks.filter(t=>t.date===today()),done=td.filter(t=>t.done).length,pct=td.length?Math.round(done/td.length*100):0,next=td.filter(t=>!t.done).sort((a,b)=>(a.time||'').localeCompare(b.time||''))[0];return `<div class="welcome"><div class="eyebrow">${new Date().toLocaleDateString('en-PK',{weekday:'long',day:'numeric',month:'long'})}</div><h2>Assalam-o-alaikum${name?' '+esc(name):''} ✦</h2><p>Aap ke din ko halka, saaf aur behtar banane ke liye.</p></div><div class="dash-grid"><article class="panel"><div class="panel-head"><h3>Aaj ki raftaar</h3><span class="quiet">${done}/${td.length}</span></div><div class="ring-wrap"><div class="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" stroke="var(--line)" stroke-width="7" fill="none"/><circle cx="38" cy="38" r="32" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" fill="none" stroke-dasharray="201" stroke-dashoffset="${201*(1-pct/100)}"/><defs><linearGradient id="rg"><stop stop-color="#0ba5f5"/><stop offset="1" stop-color="#5b4cf0"/></linearGradient></defs></svg><strong>${pct}%</strong></div><div class="ring-copy"><b>${pct===100&&td.length?'Shabash!':'Chalte rahein'}</b><span>${td.length?`${td.length-done} kaam baqi hain`:'Aaj ka pehla kaam add karein'}</span></div></div><div class="task-progress"><i style="width:${pct}%"></i></div></article><article class="panel"><div class="panel-head"><h3>Agla kaam</h3><button class="soft" data-tab="Kaam">Sab dekhein</button></div>${next?`<div class="next-task"><button class="mini-check" data-complete="${esc(next.id)}" aria-label="Kaam mukammal karein">○</button><div><b>${esc(next.title)}</b><small>${next.time?esc(next.time)+' · ':''}Aaj</small></div></div>`:`<div class="empty" style="padding:6px"><span class="sparkle">✦</span>${td.length?'Aaj ke tamam kaam mukammal!':'Abhi koi kaam nahi'}</div>`}</article></div><div class="view-title"><h2>Aaj kya karna hai?</h2><button class="soft" data-tab="Kaam">+ Kaam</button></div><div class="chip-row" style="margin-bottom:18px"><button class="chip" data-prompt="Aaj ka din plan karne mein meri madad karein">Aaj ka plan</button><button class="chip" data-prompt="Mujhe focus karne ke liye 3 tips dein">Focus tips</button><button class="chip" data-prompt="Meri yaadon ka khulasa dein">Yaad ka khulasa</button></div><article class="panel"><div class="panel-head"><h3>Aaj ke kaam</h3><span class="quiet">${fmtDate(today())}</span></div>${td.length?`<div class="task-list">${td.slice(0,4).map(taskHTML).join('')}</div>`:`<div class="empty"><span class="sparkle">✦</span>Chhoti shuruat bhi bari baat hai.<br>Apna pehla kaam shaamil karein.</div>`}</article>`}
function taskHTML(t){return `<div class="task-card ${t.done?'done':''}" data-taskrow="${esc(t.id)}"><button class="task-check" data-complete="${esc(t.id)}" aria-label="${t.done?'Mukammal se wapas':'Mukammal karein'}">${t.done?'✓':''}</button><div class="task-meta"><div class="task-name">${esc(t.title)}${t.priority?'<span class="badge-pri">Zaroori</span>':''}</div><div class="task-sub">${t.time?esc(t.time)+' · ':''}${fmtDate(t.date)}${t.done?' · Mukammal':''}</div></div><button class="delete-btn" data-delete="${esc(t.id)}" aria-label="Kaam delete karein">×</button></div>`}
function renderTasks(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i);return d}),td=tasks.filter(t=>t.date===today()),dones=td.filter(t=>t.done).length;let filtered=tasks.filter(t=>filter==='Sab'?true:filter==='Aaj'?t.date===today():filter==='Baqi'?!t.done:filter==='Mukammal'?t.done:!!t.priority);let groups=[['Guzar chuke',t=>t.date<today()&&!t.done],['Aaj',t=>t.date===today()],['Kal',t=>t.date===iso(new Date(Date.now()+86400000))],['Is hafte',t=>t.date>iso(new Date(Date.now()+86400000))&&t.date<=iso(new Date(Date.now()+7*86400000))],['Baad mein',t=>t.date>iso(new Date(Date.now()+7*86400000))],['Mukammal',t=>t.done]];return `<div class="panel" style="margin-bottom:14px"><div class="panel-head"><div><h3>Aaj ka maqsad</h3><span class="quiet">${dones}/${td.length} mukammal</span></div><b>${td.length?Math.round(dones/td.length*100):0}%</b></div><div class="task-progress"><i style="width:${td.length?dones/td.length*100:0}%"></i></div></div>${dashCards()}<div class="weekstrip">${days.map(d=>`<button class="daypill ${iso(d)===selectedDate?'active':''}" data-day="${iso(d)}"><small>${weekDay(d)}</small><b>${d.getDate()}</b></button>`).join('')}</div><div class="view-title"><h2>Apne kaam</h2><button class="primary" id="addtask">+ Naya kaam</button></div><div class="chip-row" style="margin-bottom:14px">${['Sab','Aaj','Baqi','Mukammal','Zaroori'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div id="taskgroups">${filter==='Sab'?groups.map(([label,fn])=>{let list=tasks.filter(fn);return list.length?`<div class="section-label">${label} · ${list.length}</div><div class="task-list">${list.map(taskHTML).join('')}</div>`:''}).join('')||'<div class="empty"><span class="sparkle">✦</span>Yahan abhi koi kaam nahi. Apna pehla kaam add karein.</div>':filtered.length?`<div class="task-list">${filtered.map(taskHTML).join('')}</div>`:'<div class="empty"><span class="sparkle">✦</span>Is filter mein koi kaam nahi mila.</div>'}</div>`}
function renderMemory(){return `<div class="view-title"><h2>Aap ki yaadein</h2><button class="primary" id="addmemory">+ Yaad</button></div><div class="search"><input class="field" id="memsearch" placeholder="Yaadon mein talash karein..." value="${esc(memQuery)}" aria-label="Yaad talash karein"></div><div id="memorylist" class="memory-grid">${memoryCards()}</div>`}
function memoryCards(){let arr=memory.map((text,i)=>({text,i})).filter(m=>m.text.toLowerCase().includes(memQuery.toLowerCase()));return arr.length?arr.map(m=>`<article class="memory-card"><p>${esc(m.text)}</p><div class="memory-actions"><button class="delete-btn" data-memedit="${m.i}" aria-label="Yaad edit karein">✎</button><button class="delete-btn" data-memdelete="${m.i}" aria-label="Yaad delete karein">×</button></div></article>`).join(''):`<div class="empty" style="grid-column:1/-1"><span class="sparkle">✦</span>${memQuery?'Koi milti yaad nahi mili.':'Aap ki khaas baatein yahan mehfooz hongi.'}</div>`}
function hijriApprox(date){try{return new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric'}).format(date)}catch{return '·'}}
function renderCalendar(){let yr=monthCursor.getFullYear(),mo=monthCursor.getMonth(),first=new Date(yr,mo,1),days=new Date(yr,mo+1,0).getDate(),offset=(first.getDay()+6)%7;let cells=Array.from({length:offset},()=>'<div></div>');for(let d=1;d<=days;d++){let date=new Date(yr,mo,d),s=iso(date),has=tasks.some(t=>t.date===s&&!t.done);cells.push(`<button class="calday ${s===selectedDate?'selected':''} ${s===today()?'today':''} ${has?'has-task':''}" data-calday="${s}" aria-label="${s}"><b>${d}</b><small>${hijriApprox(date)}</small></button>`)}let selected=tasks.filter(t=>t.date===selectedDate);return `<div class="panel"><div class="calendar-head"><button class="soft" id="prevmonth" aria-label="Pichla mahina">‹</button><strong>${monthCursor.toLocaleDateString('en',{month:'long',year:'numeric'})}</strong><button class="soft" id="nextmonth" aria-label="Agla mahina">›</button></div><div class="calgrid">${['P','M','T','W','T','F','H'].map(d=>`<div class="calweekday">${d}</div>`).join('')}${cells.join('')}</div><p class="quiet" style="margin:12px 0 0">Chhote nishan un dinon ke hain jin mein kaam hain. Hijri tareekh andazati ho sakti hai.</p></div><div class="view-title"><div><h2>${fmtDate(selectedDate)}</h2><span class="quiet">${selectedDate===today()?'Aaj ka din':'Chuna hua din'}</span></div><button class="primary" id="caladd">+ Kaam</button></div><div class="task-list">${selected.length?selected.map(taskHTML).join(''):'<div class="empty"><span class="sparkle">✦</span>Is din ke liye abhi kuch plan nahi.</div>'}</div><div class="panel" style="margin-top:14px"><h3>Pakistan ke aham din</h3><p class="quiet">14 August · Yom-e-Azadi &nbsp; / &nbsp; 23 March · Pakistan Day<br>1 May · Labour Day &nbsp; / &nbsp; 25 December · Quaid-e-Azam Day</p></div>`}
function renderSettings(){let accent=localStorage.getItem('ma_accent')||'#2877f0';return `<div class="view-title"><h2>Apni pasand</h2></div><div class="settings-grid"><article class="setting"><h3>Profile</h3><label>Aap ka naam</label><input class="field" id="setname" placeholder="Naam (ikhtiyari)" value="${esc(name)}"></article><article class="setting"><h3>Theme</h3><label>Apna andaaz</label><select class="field" id="theme"><option value="auto" ${theme==='auto'?'selected':''}>Auto</option><option value="light" ${theme==='light'?'selected':''}>Light</option><option value="dark" ${theme==='dark'?'selected':''}>Dark</option></select><label>Accent rang</label><div class="color-row">${['#2877f0','#39bfff','#5b4cf0'].map(c=>`<button class="swatch" data-accent="${c}" style="background:${c}" aria-label="Accent ${c}" aria-pressed="${accent===c}"></button>`).join('')}</div></article><article class="setting"><h3>Text ka size</h3><input id="fontsize" type="range" min="13" max="19" value="${Number(localStorage.getItem('ma_font'))||15}" class="field"><p>Apni aankhon ke liye munasib size chunein.</p></article><article class="setting"><h3>Awaz</h3><label>Zaban</label><select class="field" id="voicelang"><option value="ur-PK">Urdu</option><option value="en-US">English</option></select><label>Jawab sunayein</label><select class="field" id="voicereply"><option value="false">Band</option><option value="true">Chalu</option></select><label>Awaz ki raftaar</label><input class="field" id="voicerate" type="range" min="0.7" max="1.4" step="0.1" value="${localStorage.getItem('ma_voice_rate')||1}"></article><article class="setting"><h3>Hands-free</h3><p>Ye app kholte hi apne aap chalu ho jata hai, koi button dabana nahi. Bas "Meri Assistant" kahein, wo "Ji?" bolegi, phir sawal poochein aur wo awaz mein jawab degi. Band karna ho to neeche wala button dabayein.</p><label>Bulane ka naam</label><input class="field" id="wakename" placeholder="Meri Assistant" value="${esc(localStorage.getItem('ma_wake_name')||'Meri Assistant')}"><p style="margin-top:8px">Pehli baar microphone ki ijazat poochay to Allow karein. App khuli aur screen on rakhein, screen band hone par ye ruk jata hai.</p></article><article class="setting"><h3>Notifications</h3><p>Subah ka digest aur push reminders.</p><label>Digest ka waqt</label><input class="field" id="digest" type="time" value="${esc(typeof window.maDh==='number'?String(window.maDh).padStart(2,'0')+':00':(window.maDh||'08:00'))}"><button class="primary" id="savedigest" style="margin-top:8px">Waqt save karein</button><button class="soft" id="pushbtn" style="margin:8px 0 0 6px">Notifications on</button></article><article class="setting"><h3>Hifazat</h3><p>App ko PIN se lock karein.</p><button class="soft" id="setpin">PIN set / tabdeel</button><button class="soft" id="clearpin" style="margin-left:5px">PIN hatayein</button></article><article class="setting"><h3>App</h3><p>Phone par app install karein, ya apni guftagu export karein.</p><button class="soft" id="install">App install</button><button class="soft" id="export" style="margin:7px 0 0 5px">Chat export</button><button class="soft" id="clearchat" style="margin:7px 0 0 5px">Chat saaf</button><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="primary" id="backupmake">Backup banayein</button><button class="soft" id="backuprestore">Backup wapas layein</button><input id="backupfile" type="file" accept="application/json,.json" hidden></div></article><article class="setting"><h3>Backend rabta</h3><p>${cfg?esc(cfg.url):'Backend setup nahi hua.'}</p><button class="soft" id="reconfig">Setup / disconnect</button></article></div>`}

function dashCards(){
 let todayTasks=tasks.filter(t=>t.date===today()),completedToday=todayTasks.filter(t=>t.done).length,overdue=tasks.filter(t=>!t.done&&t.date<today()).length;
 let last7=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=iso(d);return {label:d.toLocaleDateString('en',{weekday:'short'}),count:tasks.filter(t=>t.date===key&&t.done).length}});
 let maxWeek=Math.max(1,...last7.map(x=>x.count));
 return `<div class="home-dashboard" style="padding-bottom:6px;margin-bottom:8px"><div class="home-stats"><article class="stat-card"><div class="stat-icon blue">✓</div><div><span>Aaj ke kaam</span><strong>${todayTasks.length-completedToday}<small> / ${todayTasks.length}</small></strong><em>${completedToday} mukammal</em></div></article><article class="stat-card"><div class="stat-icon amber">◷</div><div><span>Pending alerts</span><strong>${overdue}</strong><em>Guzar chuke kaam</em></div></article></div><article class="weekly-card"><div class="weekly-top"><div><b>Haftay ki progress</b><small>Pichlay 7 din · mukammal kaam</small></div><span>7 DIN</span></div><div class="week-bars" role="img" aria-label="Pichlay saat din mukammal kaamon ka chart">${last7.map(x=>`<div class="week-bar" title="${x.label}: ${x.count} mukammal kaam"><strong>${x.count}</strong><i style="--bar-height:${Math.max(7,Math.round(x.count/maxWeek*66))}px"></i><span>${x.label}</span></div>`).join('')}</div></article></div>`}
function chatView(){
 let h=new Date().getHours(),suggestions=(h<12?['Aaj ka plan banayein','Subah ka digest','Kaam shaamil']:h<18?['Focus ka plan','Mera agla kaam?','Yaad rakh lein']:['Kal ki tayari','Aaj ka khulasa','Sukoon ke tips']);
 let next=tasks.filter(t=>!t.done).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
 let status=(HF.on&&HF.msg)?HF.msg:(next?'Agla kaam: '+next.title:'Boliye, main sun rahi hoon ✦');
 return `<div class="chat-layout chat-first">
  <section class="cf-hero"><div class="cf-robot" data-s="${HF.on?HF.state:''}">${robotMarkup('cf-mascot')}</div><div class="cf-copy"><h2>${h<12?'Subah bakhair':h<18?'Assalam-o-alaikum':'Shaam bakhair'}${name?' '+esc(name):''}!</h2><p id="cfstatus">${esc(status)}</p></div></section>
  <div class="chip-row prompt-row cf-chips">${suggestions.map(s=>`<button class="chip" data-prompt="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <section class="chat-panel">
   <div class="chat-panel-head"><small>Aap ki guftagu</small><div class="chat-tools"><button class="soft" id="hfchat" data-hf="chat" aria-label="Hands-free" title="Hands-free">👂</button></div></div>
   <div class="chat-scroll" id="chatmessages">${chatMessages()}</div>
   <div class="composer"><button class="icon-btn mic-btn" id="mic" aria-label="Awaz record karein">🎙</button><textarea id="chatinput" rows="1" placeholder="Meri Assistant se baat karein..." aria-label="Paigham"></textarea><button class="icon-btn send" id="send" aria-label="Paigham bhejein">➤</button></div>
  </section>
 </div>`;
}
function chatMessages(){if(!history.length)return `<div class="empty" style="margin:auto"><span class="sparkle">✦</span><b style="color:var(--ink);font-size:14px">Kis cheez mein madad chahiye?</b><p>Apni baat likhein, ya awaz se batayein.</p></div>`;let filtered=history.map((m,i)=>({...m,i})).filter(m=>!chatQuery||m.text.toLowerCase().includes(chatQuery.toLowerCase()));return filtered.map(m=>`<article class="bubble ${m.role==='user'?'user':'ai'}" data-message="${m.i}">${esc(m.text)}${m.role==='ai'?`<div class="msg-foot">${m.added||m.remembered?`<div class="msg-chips" style="margin:0">${m.added?'<span>Kaam shaamil</span>':''}${m.remembered?'<span>Yaad rakh liya</span>':''}</div>`:'<span></span>'}<button class="msg-more" data-msgmenu="${m.i}" aria-label="Zyada options">⋯</button></div>`:''}</article>`).join('')+(typing?'<div class="bubble ai" aria-label="Assistant likh raha hai">✦ Soch rahi hoon ···</div>':'')}

function setupScreen(){ $('#app').innerHTML=`<div class="lockscreen"><form class="lockcard" id="setup"><img src="logo-mark.png" alt="Meri Assistant"><h1>Meri Assistant</h1><p>Chaliye, pehli mulaqat mukammal karein.</p><label class="quiet" for="worker">Worker address</label><input class="field" id="worker" required type="url" placeholder="https://aap-ka-worker.workers.dev"><label class="quiet" for="appkey">App key</label><input class="field" id="appkey" required autocomplete="off" placeholder="Apni app key"><label class="quiet" for="yourname">Naam (ikhtiyari)</label><input class="field" id="yourname" placeholder="Aap ko kya pukarein?"><button class="primary" style="width:100%;margin-top:12px">Shuru karein ✦</button><p>Config isi device ke local storage mein rahegi.</p></form></div>`;$('#setup').onsubmit=e=>{e.preventDefault();cfg={url:$('#worker').value.trim(),key:$('#appkey').value.trim()};set('as_cfg',cfg);name=$('#yourname').value.trim();localStorage.setItem('ma_name',name);render();refresh()}}
function lockScreen(){ $('#app').innerHTML=`<div class="lockscreen"><form class="lockcard" id="unlock"><img src="logo-mark.png" alt=""><h1>Khush aamdeed</h1><p>Apna PIN daal kar app kholein.</p><input class="field" id="pinentry" type="password" inputmode="numeric" pattern="[0-9]*" required placeholder="PIN" aria-label="PIN"><button class="primary" style="width:100%;margin-top:10px">Unlock</button></form></div>`;$('#unlock').onsubmit=async e=>{e.preventDefault();let dig=await sha('ma:'+$('#pinentry').value);if(dig===get('ma_lock',null)){sessionStorage.setItem('ma_unlocked','1');render();refresh()}else toast('PIN durust nahi.') }}

 $('#backupfile').onchange=async e=>{let f=e.target.files&&e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data||data.format!=='meri-assistant-backup'||data.version!==1||!Array.isArray(data.chat)||!data.chat.every(m=>m&&['user','ai'].includes(m.role)&&typeof m.text==='string')||typeof data.name!=='string'||!['auto','light','dark'].includes(data.theme)||typeof data.accent!=='string'||!/^#[0-9a-f]{6}$/i.test(data.accent)||!data.voice||typeof data.voice.lang!=='string'||typeof data.voice.wakeName!=='string')throw Error('Backup file durust nahi hai.');set('as_msgs',data.chat);history=data.chat;localStorage.setItem('ma_name',data.name);name=data.name;set('as_theme',data.theme);theme=data.theme;localStorage.setItem('ma_accent',data.accent);localStorage.setItem('ma_voice_lang',data.voice.lang);localStorage.setItem('ma_voice_reply',String(data.voice.reply));localStorage.setItem('ma_voice_rate',String(data.voice.rate));localStorage.setItem('ma_wake_name',data.voice.wakeName);localStorage.setItem('ma_hf_auto',data.voice.handsFree?'true':'false');toast('Backup wapas aa gaya. App reload ho rahi hai…');setTimeout(()=>location.reload(),500)}catch(err){toast(err.message||'Backup import nahi ho saka.')}finally{e.target.value=''}}}
async function subscribePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window))throw Error('Push notifications supported nahi.');let permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Notification ijazat nahi mili.');let reg=await navigator.serviceWorker.ready;let key=window.maVapid;if(!key)throw Error('Backend se VAPID key nahi mili.');let sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decodeKey(key)});await api('/api/subscribe',{sub:sub.toJSON()});await api('/api/test-push',{});toast('Notifications chalu ho gayin ✦')}catch(e){toast(e.message)}}
function decodeKey(k){let s=k.replace(/-/g,'+').replace(/_/g,'/');let raw=atob(s);return Uint8Array.from(raw,c=>c.charCodeAt(0))}
window.addEventListener('online',()=>{let e=$('#netstatus');if(e){e.textContent='Online';e.classList.remove('off')}});window.addEventListener('offline',()=>{let e=$('#netstatus');if(e){e.textContent='Offline · Cache mode';e.classList.add('off')}});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredInstall=e});
if(window.visualViewport){const syncViewport=()=>document.documentElement.style.setProperty('--app-height',window.visualViewport.height+'px');window.visualViewport.addEventListener('resize',syncViewport);syncViewport()}
applyTheme();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();if(cfg&&!lockOn)refresh();else if(cfg&&sessionStorage.getItem('ma_unlocked'))refresh();
hfAutoInit();
})();
</script></body></html>

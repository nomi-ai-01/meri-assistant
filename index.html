function dashboard(){let td=tasks.filter(t=>t.date===today()),done=td.filter(t=>t.done).length,pct=td.length?Math.round(done/td.length*100):0,next=td.filter(t=>!t.done).sort((a,b)=>(a.time||'').localeCompare(b.time||''))[0];return `<div class="welcome"><div class="eyebrow">${new Date().toLocaleDateString('en-PK',{weekday:'long',day:'numeric',month:'long'})}</div><h2>Assalam-o-alaikum${name?' '+esc(name):''} ✦</h2><p>Aaj ka din apne andaaz mein jeetain.</p></div><div class="dash-grid"><article class="panel"><div class="panel-head"><h3>Aaj ki raftaar</h3><span class="quiet">${done}/${td.length}</span></div><div class="ring-wrap"><div class="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" stroke="var(--line)" stroke-width="7" fill="none"/><circle cx="38" cy="38" r="32" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" fill="none" stroke-dasharray="201" stroke-dashoffset="${201*(1-pct/100)}"/><defs><linearGradient id="rg"><stop stop-color="#0ba5f5"/><stop offset="1" stop-color="#5b4cf0"/></linearGradient></defs></svg><strong>${pct}%</strong></div><div class="ring-copy"><b>${pct===100&&td.length?'Shabash!':'Chalte rahein'}</b><span>${td.length?`${td.length-done} kaam baqi hain`:'Aaj ka pehla kaam add karein'}</span></div></div><div class="task-progress"><i style="width:${pct}%"></i></div></article><article class="panel"><div class="panel-head"><h3>Agla kaam</h3><button class="soft" data-tab="Kaam">Sab dekhein</button></div>${next?`<div class="next-task"><button class="mini-check" data-complete="${esc(next.id)}" aria-label="Kaam mukammal karein">○</button><div><b>${esc(next.title)}</b><small>${next.time?esc(next.time)+' · ':''}Aaj</small></div></div>`:`<div class="empty" style="padding:6px"><span class="sparkle">✦</span>${td.length?'Aaj ke tamam kaam mukammal!':'Abhi koi kaam nahi'}</div>`}</article></div><div class="view-title"><h2>Aaj kya karna hai?</h2><button class="soft" data-tab="Kaam">+ Kaam</button></div><div class="chi async function addFile(f){
 if(pending.length>=6){toast('Ek saath 6 files tak.');return}
 if(f.size>15e6){toast(f.name+' bohat bari hai (15MB tak).');return}
 let n=f.name||'file';
 if(f.type.startsWith('image/')||IMG_EXT.test(n)){let a=await imgPrep(f,n);fileCache[a.id]=a.full;pending.push(a);return}
 if(f.type==='application/pdf'||/\.pdf$/i.test(n)){pending.push({id:uid(),kind:'pdf',name:n,mime:'application/pdf',data:await b64of(f)});return}

  let items=await unzipAll(await f.arrayBuffer()),texts=[],imgs=0,skipped=0;
  for(let it of items){
   if(IMG_EXT.test(it.name)&&imgs<4){let a=await imgPrep(new Blob([it.data],{type:'image/'+(it.name.split('.').pop().toLowerCase().replace('jpg','jpeg'))}),it.name.split('/').pop());fileCache[a.id]=a.full;pending.push(a);imgs++}
   else if(TEXT_EXT.test(it.name)&&texts.length<15)texts.push('=== '+it.name+' ===\n'+new TextDecoder().decode(it.data).slice(0,12000));
   else skipped++}
  if(texts.length)pending.push({id:uid(),kind:'text',name:n+' (text)',text:texts.join('\n\n').slice(0,60000)});
  toast(`Zip se ${texts.length} text file aur ${imgs} pic li gayin`+(skipped?` (${skipped} chhodi)`:''));return}
 if(f.type.startsWith('text/')||TEXT_EXT.test(n)){pending.push({id:uid(),kind:'text',name:n,text:(await f.text()).slice(0,60000)});return}

function speak(t){if(!('speechSynthesis'in window)){toast('Is browser mein read aloud nahi.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(speakClean(t));u.lang=localStorage.getItem('ma_voice_lang')||'ur-PK';u.rate=Number(localStorage.getItem('ma_voice_rate'))||1.2;u.pitch=1.05;let vs=speechSynthesis.getVoices(),lg=u.lang.slice(0,2).toLowerCase(),pre=vs.find(v=>v.lang.toLowerCase().indexOf(lg)===0&&/google|natural|online/i.test(v.name))||vs.find(v=>v.lang.toLowerCase().indexOf(lg)===0);if(pre)u.voice=pre;speechSynthesis.speak(u)}

function bindSettings(){ $('#setname').onchange=e=>{name=e.target.value.trim();localStorage.setItem('ma_name',name);toast('Naam save ho gaya')};$('#theme').onchange=e=>{theme=e.target.value;set('as_theme',theme);applyTheme()};document.querySelectorAll('[data-accent]').forEach(b=>b.onclick=()=>{localStorage.setItem('ma_accent2',b.dataset.accent);applyTheme();document.querySelectorAll('[data-accent]').forEach(x=>x.setAttribute('aria-pressed',x===b))});$('#fontsize').oninput=e=>{localStorage.setItem('ma_font',e.target.value);applyTheme()};$('#voicelang').value=localStorage.getItem('ma_voice_lang')||'ur-PK';$('#voicelang').onchange=e=>localStorage.setItem('ma_voice_lang',e.target.value);$('#voicereply').value=localStorage.getItem('ma_voice_reply')||'false';$('#voicereply').onchange=e=>localStorage.setItem('ma_voice_reply',e.target.value);$('#voicerate').onchange=e=>localStorage.setItem('ma_voice_rate',e.target.value);$('#savedigest').onclick=async()=>{try{await api('/api/settings',{digestHour:parseInt(($('#digest').value||'08:00').split(':')[0],10)}).then(r=>{window.maDh=r.digestHour});toast('Digest ka waqt save ho gaya')}catch(e){toast(e.message)}};$('#pushbtn').onclick=subscribePush;$('#setpin').onclick=()=>modal('PIN set karein','<input class="field" id="pinnew" type="password" inputmode="numeric" minlength="4" maxlength="12" required placeholder="4 se 12 digits"><input class="field" id="pinconfirm" type="password" required placeholder="PIN dobara likhein">',async()=>{let p=$('#pinnew').value;if(!/^\d{4,12}$/.test(p)||p!==$('#pinconfirm').value)throw Error('PIN 4-12 digits ho aur dono ek jaisay hon.');set('ma_lock',await sha('ma:'+p));lockOn=true;toast('PIN lock set ho gaya')});$('#clearpin').onclick=()=>{set('ma_lock',null);lockOn=false;toast('PIN lock hata diya')};$('#install').onclick=async()=>{if(window.deferredInstall){await window.deferredInstall.prompt();window.deferredInstall=null}else toast('Browser menu se “Install app” ya “Add to Home Screen” chunein.')};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(history,null,2)],{type:'application/json'}));a.download='meri-assistant-chat.json';a.click();URL.revokeObjectURL(a.href)};$('#clearchat').onclick=()=>modal('Chat saaf karein?','<p>Yeh device par mehfooz chat history mita dega. Backend data par asar nahi hoga.</p>',()=>{history=[];set('as_msgs',history);render();toast('Chat history saaf ho gayi')},'Saaf karein');$('#reconfig').onclick=()=>modal('Backend setup','<label class="quiet">Worker address</label><input class="field" id="newurl" required type="url" value="${esc(cfg.url)}"><label class="quiet">App key</label><input class="field" id="newkey" required value="${esc(cfg.key)}">',()=>{cfg={url:$('#newurl').value.trim(),key:$('#newkey').value.trim()};set('as_cfg',cfg);toast('Backend config update ho gayi');refresh()})}
async function subscribePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window))throw Error('Push notifications supported nahi.');let permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Notification ijazat nahi mili.');let reg=await navigator.serviceWorker.ready;let key=window.maVapid;if(!key)throw Error('Backend se VAPID key nahi mili.');let sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decodeKey(key)});await api('/api/subscribe',{sub:sub.toJSON()});await api('/api/test-push',{});toast('Notifications chalu ho gayin ✦')}catch(e){toast(e.message)}}
function decodeKey(k){let s=k.replace(/-/g,'+').replace(/_/g,'/');let raw=atob(s);return Uint8Array.from(raw,c=>c.charCodeAt(0))}
window.addEventListener('online',()=>{let e=$('#netstatus');if(e){e.textContent='Online';e.classList.remove('off')}});window.addEventListener('offline',()=>{let e=$('#netstatus');if(e){e.textContent='Offline · Cache mode';e.classList.add('off')}});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredInstall=e});
applyTheme();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();if(cfg&&!lockOn)refresh();else if(cfg&&sessionStorage.getItem('ma_unlocked'))refresh();
})();

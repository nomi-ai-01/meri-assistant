/* Premium companion identity */
.robot-stage{display:flex;align-items:center;gap:16px;padding:15px 17px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle at 15% 10%,#dff3ff 0,#f7fbff 42%,var(--paper) 100%);margin-bottom:13px;overflow:hidden}
html[data-mode="dark"] .robot-stage{background:radial-gradient(circle at 15% 10%,#17365a 0,#111b30 48%,var(--paper) 100%)}
.robot{width:76px;height:76px;flex:0 0 76px;position:relative;animation:robotFloat 3.2s ease-in-out infinite}
.robot-head{position:absolute;left:10px;top:8px;width:56px;height:46px;border-radius:19px 19px 16px 16px;background:linear-gradient(145deg,#fff,#dce8f4);border:2px solid #b9c9d9;box-shadow:inset 0 -5px 0 #c6d5e3,0 5px 12px #163b641c}
.robot-face{position:absolute;inset:8px 7px 10px;border-radius:12px;background:linear-gradient(145deg,#071a36,#102e52);display:flex;align-items:center;justify-content:center;gap:10px}
.robot-eye{width:9px;height:11px;border-radius:50%;background:#5fe4ff;box-shadow:0 0 10px #37cfff;animation:robotBlink 4.5s infinite}
.robot-smile{position:absolute;width:13px;height:5px;border-bottom:2px solid #75eaff;border-radius:0 0 12px 12px;bottom:4px}
.robot-ear{position:absolute;top:21px;width:8px;height:20px;border-radius:6px;background:#d5e1ed;border:2px solid #aabbd0}
.robot-ear.left{left:3px}.robot-ear.right{right:3px}
.robot-body{position:absolute;left:20px;bottom:0;width:36px;height:22px;border-radius:12px 12px 9px 9px;background:linear-gradient(145deg,#fff,#d8e4ef);border:2px solid #b9c9d9}
.robot-body:after{content:"";position:absolute;left:13px;top:6px;width:7px;height:5px;border-radius:50%;background:#36cfff;box-shadow:0 0 8px #36cfff}
.robot-copy{min-width:0;flex:1}.robot-copy b{display:block;font-size:14px}.robot-copy p{font-size:11px;color:var(--muted);line-height:1.5;margin:4px 0 0}
.robot-spark{font-size:20px;color:#4ca9ff;animation:sparkPulse 2s ease-in-out infinite}
@keyframes robotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes robotBlink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.12)}}
@keyframes sparkPulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.opening-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#071326;color:white;animation:openingFade 1.9s ease forwards;pointer-events:none}
.opening-inner{text-align:center;animation:openingRise 1.6s ease both}
.opening-inner .robot{margin:0 auto 12px;transform:scale(1.45)}
.opening-inner b{display:block;font-size:20px;letter-spacing:.4px}
.opening-inner small{display:block;color:#9eb9d9;margin-top:5px}
@keyframes openingFade{0%,65%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes openingRise{0%{opacity:0;transform:translateY(12px) scale(.94)}35%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:1}}
.top-actions{display:flex;align-items:center;gap:7px}
.top-action{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;min-width:38px;height:38px;font-size:17px}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
.quick-grid button{border:1px solid var(--line);background:var(--wash);color:var(--ink);border-radius:14px;padding:14px;text-align:left;font-weight:700}
.quick-grid small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.weekly-panel{margin-top:13px}
.week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;height:76px;margin-top:12px}
.week-bar{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;font-size:9px;color:var(--muted)}
.week-bar i{display:block;width:min(22px,70%);min-height:4px;background:linear-gradient(180deg,#43c5f5,#465ce5);border-radius:8px 8px 3px 3px}
@media(max-width:600px){.robot-stage{padding:12px}.robot{transform:scale(.9);transform-origin:left center;margin-right:-6px}.quick-grid{grid-template-columns:1fr 1fr}}

function dashboard(){let td=tasks.filter(t=>t.date===today()),done=td.filter(t=>t.done).length,pct=td.length?Math.round(done/td.length*100):0,next=td.filter(t=>!t.done).sort((a,b)=>(a.time||'').localeCompare(b.time||''))[0];return `<div class="welcome"><div class="eyebrow">${new Date().toLocaleDateString('en-PK',{weekday:'long',day:'numeric',month:'long'})}</div><h2>Assalam-o-alaikum${name?' '+esc(name):''} ✦</h2><p>Aaj ka din apne andaaz mein jeetain.</p></div><div class="dash-grid"><article class="panel"><div class="panel-head"><h3>Aaj ki raftaar</h3><span class="quiet">${done}/${td.length}</span></div><div class="ring-wrap"><div class="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" stroke="var(--line)" stroke-width="7" fill="none"/><circle cx="38" cy="38" r="32" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" fill="none" stroke-dasharray="201" stroke-dashoffset="${201*(1-pct/100)}"/><defs><linearGradient id="rg"><stop stop-color="#0ba5f5"/><stop offset="1" stop-color="#5b4cf0"/></linearGradient></defs></svg><strong>${pct}%</strong></div><div class="ring-copy"><b>${pct===100&&td.length?'Shabash!':'Chalte rahein'}</b><span>${td.length?`${td.length-done} kaam baqi hain`:'Aaj ka pehla kaam add karein'}</span></div></div><div class="task-progress"><i style="width:${pct}%"></i></div></article><article class="panel"><div class="panel-head"><h3>Agla kaam</h3><button class="soft" data-tab="Kaam">Sab dekhein</button></div>${next?`<div class="next-task"><button class="mini-check" data-complete="${esc(next.id)}" aria-label="Kaam mukammal karein">○</button><div><b>${esc(next.title)}</b><small>${next.time?esc(next.time)+' · ':''}Aaj</small></div></div>`:`<div class="empty" style="padding:6px"><span class="sparkle">✦</span>${td.length?'Aaj ke tamam kaam mukammal!':'Abhi koi kaam nahi'}</div>`}</article></div><div class="view-title"><h2>Aaj kya karna hai?</h2><button class="soft" data-tab="Kaam">+ Kaam</button></div><div class="chip-row" style="margin-bottom:18px"><button class="chip" data-prompt="Aaj ka din plan karne mein meri madad karein">Aaj ka plan</button><button class="chip" data-prompt="Mujhe focus karne ke liye 3 tips dein">Focus tips</button><button class="chip" data-prompt="Meri yaadon ka khulasa dein">Yaad ka khulasa</button></div><article class="panel"><div class="panel-head"><h3>Aaj ke kaam</h3><span class="quiet">${fmtDate(today())}</span></div>${td.length?`<div class="task-list">${td.slice(0,4).map(taskHTML).join('')}</div>`:`<div class="empty"><span class="sparkle">✦</span>Chhoti shuruat bhi bari baat hai.<br>Apna pehla kaam shaamil karein.</div>`}</article>`}
function taskHTML(t){return `<div class="task-card ${t.done?'done':''}" data-taskrow="${esc(t.id)}"><button class="task-check" data-complete="${esc(t.id)}" aria-label="${t.done?'Mukammal se wapas':'Mukammal karein'}">${t.done?'✓':''}</button><div class="task-meta"><div class="task-name">${esc(t.title)}${t.priority?'<span class="badge-pri">Zaroori</span>':''}</div><div class="task-sub">${t.time?esc(t.time)+' · ':''}${fmtDate(t.date)}${t.done?' · Mukammal':''}</div></div><button class="delete-btn" data-delete="${esc(t.id)}" aria-label="Kaam delete karein">×</button></div>`}
function renderTasks(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i);return d}),td=tasks.filter(t=>t.date===today()),dones=td.filter(t=>t.done).length;let filtered=tasks.filter(t=>filter==='Sab'?true:filter==='Aaj'?t.date===today():filter==='Baqi'?!t.done:filter==='Mukammal'?t.done:!!t.priority);let groups=[['Guzar chuke',t=>t.date<today()&&!t.done],['Aaj',t=>t.date===today()],['Kal',t=>t.date===iso(new Date(Date.now()+86400000))],['Is hafte',t=>t.date>iso(new Date(Date.now()+86400000))&&t.date<=iso(new Date(Date.now()+7*86400000))],['Baad mein',t=>t.date>iso(new Date(Date.now()+7*86400000))],['Mukammal',t=>t.done]];return `<div class="panel" style="margin-bottom:14px"><div class="panel-head"><div><h3>Aaj ka maqsad</h3><span class="quiet">${dones}/${td.length} mukammal</span></div><b>${td.length?Math.round(dones/td.length*100):0}%</b></div><div class="task-progress"><i style="width:${td.length?dones/td.length*100:0}%"></i></div></div><div class="weekstrip">${days.map(d=>`<button class="daypill ${iso(d)===selectedDate?'active':''}" data-day="${iso(d)}"><small>${weekDay(d)}</small><b>${d.getDate()}</b></button>`).join('')}</div><div class="view-title"><h2>Apne kaam</h2><button class="primary" id="addtask">+ Naya kaam</button></div><div class="chip-row" style="margin-bottom:14px">${['Sab','Aaj','Baqi','Mukammal','Zaroori'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div id="taskgroups">${filter==='Sab'?groups.map(([label,fn])=>{let list=tasks.filter(fn);return list.length?`<div class="section-label">${label} · ${list.length}</div><div class="task-list">${list.map(taskHTML).join('')}</div>`:''}).join('')||'<div class="empty"><span class="sparkle">✦</span>Yahan abhi koi kaam nahi. Apna pehla kaam add karein.</div>':filtered.length?`<div class="task-list">${filtered.map(taskHTML).join('')}</div>`:'<div class="empty"><span class="sparkle">✦</span>Is filter mein koi kaam nahi mi function renderMemory(){return `<div class="view-title"><h2>Aap ki yaadein</h2><button class="primary" id="addmemory">+ Yaad</button></div><div class="search"><input class="field" id="memsearch" placeholder="Yaadon mein talash karein..." value="${esc(memQuery)}" aria-label="Yaad talash karein"></div><div id="memorylist" class="memory-grid">${memoryCards()}</div>`}
function memoryCards(){let arr=memory.map((text,i)=>({text,i})).filter(m=>m.text.toLowerCase().includes(memQuery.toLowerCase()));return arr.length?arr.map(m=>`<article class="memory-card"><p>${esc(m.text)}</p><button class="delete-btn" data-memdelete="${m.i}" aria-label="Yaad delete karein">×</button></article>`).join(''):`<div class="empty" style="grid-column:1/-1"><span class="sparkle">✦</span>${memQuery?'Koi milti yaad nahi mili.':'Aap ki khaas baatein yahan mehfooz hongi.'}</div>`}
function hijriApprox(date){try{return new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric'}).format(date)}catch{return '·'}}
function renderCalendar(){let yr=monthCursor.getFullYear(),mo=monthCursor.getMonth(),first=new Date(yr,mo,1),days=new Date(yr,mo+1,0).getDate(),offset=(first.getDay()+6)%7;let cells=Array.from({length:offset},()=>'<div></div>');for(let d=1;d<=days;d++){let date=new Date(yr,mo,d),s=iso(date),has=tasks.some(t=>t.date===s&&!t.done);cells.push(`<button class="calday ${s===selectedDate?'selected':''} ${s===today()?'today':''} ${has?'has-task':''}" data-calday="${s}" aria-label="${s}"><b>${d}</b><small>${hijriApprox(date)}</small></button>`)}let selected=tasks.filter(t=>t.date===selectedDate);return `<div class="panel"><div class="calendar-head"><button class="soft" id="prevmonth" aria-label="Pichla mahina">‹</button><strong>${monthCursor.toLocaleDateString('en',{month:'long',year:'numeric'})}</strong><button class="soft" id="nextmonth" aria-label="Agla mahina">›</button></div><div class="calgrid">${['P','M','T','W','T','F','H'].map(d=>`<div class="calweekday">${d}</div>`).join('')}${cells.join('')}</div><p class="quiet" style="margin:12px 0 0">Chhote nishan un dinon ke hain jin mein kaam hain. Hijri tareekh andazati ho sakti hai.</p></div><div class="view-title"><div><h2>${fmtDate(selectedDate)}</h2><span class="quiet">${selectedDate===today()?'Aaj ka din':'Chuna hua din'}</span></div><button class="primary" id="caladd">+ Kaam</button></div><div class="task-list">${selected.length?selected.map(taskHTML).join(''):'<div class="empty"><span class="sparkle">✦</span>Is din ke liye abhi kuch plan nahi.</div>'}</div><div class="panel" style="margin-top:14px"><h3>Pakistan ke aham din</h3><p class="quiet">14 August · Yom-e-Azadi &nbsp; / &nbsp; 23 March · Pakistan Day<br>1 May · Labour Day &nbsp; / &nbsp; 25 December · Quaid-e-Azam Day</p></div>`}
function renderSettings(){let accent=localStorage.getItem('ma_accent')||'#1e5be0';return `<div class="view-title"><h2>Apni pasand</h2></div><div class="settings-grid"><article class="setting"><h3>Profile</h3><label>Aap ka naam</label><input class="field" id="setname" placeholder="Naam (ikhtiyari)" value="${esc(name)}"></article><article class="setting"><h3>Theme</h3><label>Apna andaaz</label><select class="field" id="theme"><option value="auto" ${theme==='auto'?'selected':''}>Auto</option><option value="light" ${theme==='light'?'selected':''}>Light</option><option value="dark" ${theme==='dark'?'selected':''}>Dark</option></select><label>Accent rang</label><div class="color-row">${['#1e5be0','#0ba5f5','#5b4cf0','#14966c','#e78a25'].map(c=>`<button class="swatch" data-accent="${c}" style="background:${c}" aria-label="Accent ${c}" aria-pressed="${accent===c}"></button>`).join('')}</div></article><article class="setting"><h3>Text ka size</h3><input id="fontsize" type="range" min="13" max="19" value="${Number(localStorage.getItem('ma_font'))||15}" class="field"><p>Apni aankhon ke liye munasib size chunein.</p></article><article class="setting"><h3>Awaz</h3><label>Zaban</label><select class="field" id="voicelang"><option value="ur-PK">Urdu</option><option value="en-US">English</option></select><label>Jawab sunayein</label><select class="field" id="voicereply"><option value="false">Band</option><option value="true">Chalu</option></select><label>Awaz ki raftaar</label><input class="field" id="voicerate" type="range" min="0.7" max="1.4" step="0.1" value="${localStorage.getItem('ma_voice_rate')||1}"></article><article class="setting"><h3>Notifications</h3><p>Subah ka digest aur push reminders.</p><label>Digest ka waqt</label><input class="field" id="digest" type="time" value="${esc(typeof window.maDh==='number'?String(window.maDh).padStart(2,'0')+':00':(window.maDh||'08:00'))}"><button class="primary" id="savedigest" style="margin-top:8px">Waqt save karein</button><button class="soft" id="pushbtn" style="margin:8px 0 0 6px">Notifications on</button></article><article class="setting"><h3>Hifazat</h3><p>App ko PIN se lock karein.</p><button class="soft" id="setpin">PIN set / tabdeel</button><button class="soft" id="clearpin" style="margin-left:5px">PIN hatayein</button></article><article class="setting"><h3>App</h3><p>Phone par app install karein, ya apni guftagu export karein.</p><button class="soft" id="install">App install</button><button class="soft" id="export" style="margin:7px 0 0 5px">Chat export</button><button class="soft" id="clearchat" style="margin:7px 0 0 5px">Chat saaf</button></article><article class="setting"><h3>Backend rabta</h3><p>${cfg?esc(cfg.url):'Backend setup nahi hua.'}</p><button class="soft" id="reconfig">Setup / disconnect</button></article></div>`}
function chatView(){let todayTasks=tasks.filter(t=>t.date===today()),completedToday=todayTasks.filter(t=>t.done).length;let suggestions=(new Date().getHours()<12?['Aaj ka plan banayein','Subah ka digest','Kaam shaamil']:new Date().getHours()<18?['Focus ka plan','Mera agla kaam?','Yaad rakh lein']:['Kal ki tayari','Aaj ka khulasa','Sukoon ke tips']);let overdue=tasks.filter(t=>!t.done&&t.date<today()).length;let last7=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=iso(d);return {label:d.toLocaleDateString('en',{weekday:'short'}),count:tasks.filter(t=>t.date===key&&t.done).length}});let maxWeek=Math.max(1,...last7.map(x=>x.count));return `<div class="chat-layout"><div class="robot-stage"><div class="robot"><span class="robot-ear left"></span><span class="robot-ear right"></span><div class="robot-head"><div class="robot-face"><i class="robot-eye"></i><i class="robot-eye"></i><span class="robot-smile"></span></div></div><div class="robot-body"></div></div><div class="robot-copy"><b>Meri Assistant <span class="robot-spark">✦</span></b><p>Assalam-o-alaikum${name?' '+esc(name):''}! Main aap ke din ko asaan banane ke liye yahan hoon.</p></div></div><div class="welcome" style="padding:14px 18px;margin-bottom:12px"><div class="eyebrow">${new Date().toLocaleDateString('en-PK',{weekday:'long',day:'numeric',month:'long'})}</div><h2 style="font-size:19px;margin:6px 0">Assalam-o-alaikum${name?' '+esc(name):''} ✦</h2><p>Aaj ke ${completedToday}/${todayTasks.length} kaam mukammal · ${todayTasks.length-completedToday} baqi</p></div><div class="dash-grid"><article class="panel"><div class="panel-head"><h3>Aaj ke kaam</h3><span class="quiet">${completedToday}/${todayTasks.length}</span></div><b style="font-size:23px">${todayTasks.length-completedToday}</b><p class="quiet">abhi baqi</p></article><article class="panel"><div class="panel-head"><h3>Pending alerts</h3><span class="quiet">Tawajjo</span></div><b style="font-size:23px">${overdue}</b><p class="quiet">guzar chuke kaam</p></article></div><article class="panel weekly-panel"><div class="panel-head"><h3>Weekly progress</h3><span class="quiet">Pichlay 7 din</span></div><div class="week-bars">${last7.map(x=>`<div class="week-bar"><i style="height:${Math.max(6,x.count/maxWeek*58)}px"></i><span>${x.label}</span></div>`).join('')}</div></article><div class="chat-greet"><img src="logo-mark.png" alt=""><div><b>Meri Assistant</b><small>Yahan hoon, batayein ✦</small></div><div class="chat-tools"><button class="soft" id="chatsearch" aria-label="Chat talash">⌕</button><button class="soft" id="pinned" aria-label="Pinned paighamaat">♧</button></div></div><div class="chip-row" style="margin-bottom:12px">${suggestions.map(s=>`<button class="chip" data-prompt="${esc(s)}">${esc(s)}</button>`).join('')}</div><div class="chat-scroll" id="chatmessages">${chatMessages()}</div><div class="composer"><button class="icon-btn" id="mic" aria-label="Awaz record karein">♩</button><textarea id="chatinput" rows="1" placeholder="Apni baat yahan likhein..." aria-label="Paigham"></textarea><button class="icon-btn send" id="send" aria-label="Paigham bhejein">➤</button></div></div>`}

function setupScreen(){ $('#app').innerHTML=`<div class="lockscreen"><form class="lockcard" id="setup"><img src="logo-mark.png" alt="Meri Assistant"><h1>Meri Assistant</h1><p>Chaliye, pehli mulaqat mukammal karein.</p><label class="quiet" for="worker">Worker address</label><input class="field" id="worker" required type="url" placeholder="https://aap-ka-worker.workers.dev"><label class="quiet" for="appkey">App key</label><input class="field" id="appkey" required autocomplete="off" placeholder="Apni app key"><label class="quiet" for="yourname">Naam (ikhtiyari)</label><input class="field" id="yourname" placeholder="Aap ko kya pukarein?"><button class="primary" style="width:100%;margin-top:12px">Shuru karein ✦</button><p>Config isi device ke local storage mein rahegi.</p></form></div>`;$('#setup').onsubmit=e=>{e.preventDefault();cfg={url:$('#worker').value.trim(),key:$('#appkey').value.trim()};set('as_cfg',cfg);name=$('#yourname').value.trim();localStorage.setItem('ma_name',name);render();refresh()}}
function lockScreen(){ $('#app').innerHTML=`<div class="lockscreen"><form class="lockcard" id="unlock"><img src="logo-mark.png" alt=""><h1>Khush aamdeed</h1><p>Apna PIN daal kar app kholein.</p><input class="field" id="pinentry" type="password" inputmode="numeric" pattern="[0-9]*" required placeholder="PIN" aria-label="PIN"><button class="primary" style="width:100%;margin-top:10px">Unlock</button></form></div>`;$('#unlock').onsubmit=async e=>{e.preventDefault();let dig=await sha('ma:'+$('#pinentry').value);if(dig===get('ma_lock',null)){sessionStorage.setItem('ma_unlocked','1');render();refresh()}else toast('PIN durust nahi.') }}
async function sha(v){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function modal(title,body,submit,label='Save'){ $('#modalroot').innerHTML=`<div class="modal-back" role="dialog" aria-modal="true"><form class="modal" id="modalform"><h2>${title}</h2>${body}<div class="modal-actions"><button type="button" class="soft" id="modalcancel">Radd</button><button class="primary">${label}</button></div></form></div>`;$('#modalcancel').onclick=()=>$('#modalroot').innerHTML='';$('#modalform').onsubmit=async e=>{e.preventDefault();try{await submit();$('#modalroot').innerHTML=''}catch(err){toast(err.message)}}}
function taskForm(date=today()){modal('Naya kaam',`<label class="quiet">Kaam ka naam</label><input id="ftitle" class="field" required maxlength="260" placeholder="Misal: Dawa lena"><div class="formgrid"><div><label class="quiet">Tareekh</label><input id="fdate" class="field" type="date" required value="${date}"></div><div><label class="quiet">Waqt (ikhtiyari)</label><input id="ftime" class="field" type="time"></div></div><label style="display:flex;gap:9px;align-items:center;margin-top:10px"><input type="checkbox" id="fpriority"> Zaroori kaam</label>`,async()=>{let title=$('#ftitle').value.trim(),date=$('#fdate').value,time=$('#ftime').value,priority=$('#fpriority').checked;if(!title||!date)throw Error('Naam aur tareekh zaroori hain.');let r=await api('/api/task',{title,date,time});let item=r.task||r.addedTask||{id:r.id||('local-'+Date.now()),title,date,time,done:false};item.priority=priority;tasks.push(item);render();toast('Kaam shaamil ho gaya ✦')})}
function bind(){if($('#quickaction'))$('#quickaction').onclick=quickActions;if($('#globalsearch'))$('#globalsearch').onclick=globalSearch;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});$('#profile').onclick=()=>{active='Settings';render()};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{active='Baat';render();$('#chatinput').value=b.dataset.prompt;sendChat()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>completeTask(b.dataset.complete));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteTask(b.dataset.delete));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.day;render()});$('#addtask').onclick=()=>taskForm(selectedDate);$('#caladd').onclick=()=>taskForm(selectedDate);$('#addmemory').onclick=()=>modal('Nayi yaad','<textarea class="field" id="newmem" required rows="3" placeholder="Kya yaad rakhna hai?"></textarea>',async()=>{let add=$('#newmem').value.trim();if(!add)return;await api('/api/memory',{add});memory.push(add);render();toast('Yaad rakh li ✦')});$('#memsearch').oninput=e=>{memQuery=e.target.value;$('#memorylist').innerHTML=memoryCards();bindMemoryDeletes()};bindMemoryDeletes();document.querySelectorAll('[data-calday]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.calday;render()});$('#prevmonth').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);render()};$('#nextmonth').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);render()};$('#send').onclick=sendChat;$('#chatinput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}};$('#chatsearch').onclick=()=>modal('Chat talash karein','<input class="field" id="chatfind" placeholder="Lafz ya jumla...">',()=>{chatQuery=$('#chatfind').value;$('#chatmessages').innerHTML=chatMessages();$('#modalroot').innerHTML='' });$('#pinned').onclick=()=>{let pins=history.filter(m=>m.pinned);modal('Pinned paighamaat',pins.length?pins.map(m=>`<p>${esc(m.text)}</p>`).join(''):'<p>Abhi koi paigham pin nahi hai.</p>',()=>{},'Theek hai')};$('#mic').onclick=voiceInput;bindMsgActions();bindSettings();}

function quickActions(){modal('Quick actions',`<p>Jo kaam karna hai, seedha chunein.</p><div class="quick-grid"><button type="button" data-quick="task">＋ Naya kaam<small>Reminder aur deadline</small></button><button type="button" data-quick="memory">✧ Nayi yaad<small>Ahm baat save karein</small></button><button type="button" data-quick="voice">♩ Voice note<small>Bol kar batayein</small></button><button type="button" data-quick="chat">◉ Chat kholein<small>Assistant se baat</small></button></div>`,()=>{},'Band');document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{let a=b.dataset.quick;$('#modalroot').innerHTML='';if(a==='task'){active='Kaam';render();taskForm()}if(a==='memory'){active='Yaad';render();$('#addmemory').click()}if(a==='voice'){active='Baat';render();voiceInput()}if(a==='chat'){active='Baat';render();$('#chatinput')?.focus()}})}
function globalSearch(){modal('Universal search',`<input class="field" id="globalquery" placeholder="Tasks, yaadein aur chats mein talash..." autocomplete="off"><div id="globalresults" class="task-list" style="margin-top:12px"></div>`,()=>{},'Band');let inp=$('#globalquery'),out=$('#globalresults');function run(){let q=inp.value.trim().toLowerCase();if(!q){out.innerHTML='<div class="empty">Search karne ke liye kuch likhein.</div>';return}let hits=[];tasks.forEach(t=>{if((t.title||'').toLowerCase().includes(q))hits.push({type:'Kaam',text:t.title,tab:'Kaam'})});memory.forEach(m=>{if(m.toLowerCase().includes(q))hits.push({type:'Yaad',text:m,tab:'Yaad'})});history.forEach(m=>{if((m.text||'').toLowerCase().includes(q))hits.push({type:'Chat',text:m.text,tab:'Baat'})});out.innerHTML=hits.length?hits.slice(0,20).map((h,i)=>`<button type="button" class="task-card" data-hit="${i}" style="text-align:left"><span class="badge-pri">${h.type}</span><span class="task-meta">${esc(h.text.slice(0,150))}</span></button>`).join(''):'<div class="empty">Koi result nahi mila.</div>';out.querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>{active=hits[Number(b.dataset.hit)].tab;$('#modalroot').innerHTML='';render()})}inp.oninput=run;run();setTimeout(()=>inp.focus(),30)}
function bindMemoryDeletes(){document.querySelectorAll('[data-memdelete]').forEach(b=>b.onclick=async()=>{let idx=Number(b.dataset.memdelete);await api('/api/memory',{remove:idx});memory.splice(idx,1);render();toast('Yaad delete kar di')})}
async function completeTask(id){let t=tasks.find(x=>String(x.id)===String(id));if(!t)return;try{await api('/api/task/update',{id:t.id,done:!t.done});t.done=!t.done;render();if(t.done){toast('Shabash! Ek kaam mukammal ✦');if(navigator.vibrate)navigator.vibrate([20,35,20])}}catch(e){toast(e.message)}}
async function deleteTask(id){let ix=tasks.findIndex(x=>String(x.id)===String(id));if(ix<0)return;let obj=tasks[ix];try{await api('/api/task/update',{id:obj.id,remove:true});tasks.splice(ix,1);deleted={obj,ix};render();toast('Kaam delete ho gaya',async()=>{try{let r=await api('/api/task',{title:obj.title,date:obj.date,time:obj.time});tasks.splice(ix,0,r.task||{...obj,id:r.id||'undo-'+Date.now()});deleted=null;render();toast('Kaam wapas aa gaya')}catch(e){toast(e.message)}})}catch(e){toast(e.message)}}
async function sendChat(){let input=$('#chatinput'),text=input?.value.trim();if(!text||typing)return;history.push({role:'user',text});input.value='';set('as_msgs',history);typing=true;$('#chatmessages').innerHTML=chatMessages();$('#chatmessages').scrollTop=$('#chatmessages').scrollHeight;try{let result=await api('/api/chat',{history:history.map(m=>({role:m.role,text:m.text}))});history.push({role:'ai',text:result.reply||'Ji, main madad karti hoon.',added:!!result.added,remembered:!!result.remembered});if(result.added){await refresh()}if(result.remembered){try{await refresh()}catch{}}set('as_msgs',history);typing=false;render();if(localStorage.getItem('ma_voice_reply')==='true')speak(result.reply||'')}catch(e){typing=false;history.push({role:'ai',text:'Maazrat, abhi rabta nahi ho saka. Internet aur backend settings check karein.'});set('as_msgs',history);render();toast(e.message)}}
function bindMsgActions(){document.querySelectorAll('[data-msgact]').forEach(b=>b.onclick=async()=>{let m=history[Number(b.dataset.i)];if(!m)return;let action=b.dataset.msgact;if(action==='copy'){await navigator.clipboard?.writeText(m.text);toast('Copy ho gaya')}if(action==='download'){let blob=new Blob([m.text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meri-assistant-jawab.txt';a.click();URL.revokeObjectURL(a.href)}if(action==='speak')speak(m.text);if(action==='pin'){m.pinned=!m.pinned;set('as_msgs',history);render()}if(action==='remember'){try{await api('/api/memory',{add:m.text});memory.push(m.text);toast('Yaad rakh li ✦')}catch(e){toast(e.message)}}if(['rewrite','urdu','english'].includes(action)){let prompt=({rewrite:'Is jawab ko doosre alfaaz mein dobara likhein: ',urdu:'Is jawab ko Urdu mein likhein: ',english:'Is jawab ko English mein translate karein: '})[action]+m.text;$('#chatinput').value=prompt;sendChat()}})}
function speak(t){if(!('speechSynthesis'in window)){toast('Is browser mein read aloud nahi.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=localStorage.getItem('ma_voice_lang')||'ur-PK';u.rate=Number(localStorage.getItem('ma_voice_rate'))||1;speechSynthesis.speak(u)}
function voiceInput(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Awaz input is browser mein dastiyab nahi.');return}let rec=new SR();rec.lang=localStorage.getItem('ma_voice_lang')||'ur-PK';rec.onresult=e=>{let value=e.results[0][0].transcript;$('#chatinput').value=value;if(localStorage.getItem('ma_voice_auto_send')==='true')sendChat()};rec.onerror=()=>toast('Awaz samajh nahi aayi. Dobara koshish karein.');rec.start();toast('Suniye, bolna shuru karein…')}
function bindSettings(){ $('#setname').onchange=e=>{name=e.target.value.trim();localStorage.setItem('ma_name',name);toast('Naam save ho gaya')};$('#theme').onchange=e=>{theme=e.target.value;set('as_theme',theme);applyTheme()};document.querySelectorAll('[data-accent]').forEach(b=>b.onclick=()=>{localStorage.setItem('ma_accent',b.dataset.accent);applyTheme();document.querySelectorAll('[data-accent]').forEach(x=>x.setAttribute('aria-pressed',x===b))});$('#fontsize').oninput=e=>{localStorage.setItem('ma_font',e.target.value);applyTheme()};$('#voicelang').value=localStorage.getItem('ma_voice_lang')||'ur-PK';$('#voicelang').onchange=e=>localStorage.setItem('ma_voice_lang',e.target.value);$('#voicereply').value=localStorage.getItem('ma_voice_reply')||'false';$('#voicereply').onchange=e=>localStorage.setItem('ma_voice_reply',e.target.value);$('#voicerate').onchange=e=>localStorage.setItem('ma_voice_rate',e.target.value);$('#savedigest').onclick=async()=>{try{await api('/api/settings',{digestHour:parseInt(($('#digest').value||'08:00').split(':')[0],10)}).then(r=>{window.maDh=r.digestHour});toast('Digest ka waqt save ho gaya')}catch(e){toast(e.message)}};$('#pushbtn').onclick=subscribePush;$('#setpin').onclick=()=>modal('PIN set karein','<input class="field" id="pinnew" type="password" inputmode="numeric" minlength="4" maxlength="12" required placeholder="4 se 12 digits"><input class="field" id="pinconfirm" type="password" required placeholder="PIN dobara likhein">',async()=>{let p=$('#pinnew').value;if(!/^\d{4,12}$/.test(p)||p!==$('#pinconfirm').value)throw Error('PIN 4-12 digits ho aur dono ek jaisay hon.');set('ma_lock',await sha('ma:'+p));lockOn=true;toast('PIN lock set ho gaya')});$('#clearpin').onclick=()=>{set('ma_lock',null);lockOn=false;toast('PIN lock hata diya')};$('#install').onclick=async()=>{if(window.deferredInstall){await window.deferredInstall.prompt();window.deferredInstall=null}else toast('Browser menu se “Install app” ya “Add to Home Screen” chunein.')};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(history,null,2)],{type:'application/json'}));a.download='meri-assistant-chat.json';a.click();URL.revokeObjectURL(a.href)};$('#clearchat').onclick=()=>modal('Chat saaf karein?','<p>Yeh device par mehfooz chat history mita dega. Backend data par asar nahi hoga.</p>',()=>{history=[];set('as_msgs',history);render();toast('Chat history saaf ho gayi')},'Saaf karein');$('#reconfig').onclick=()=>modal('Backend setup','<label class="quiet">Worker address</label><input class="field" id="newurl" required type="url" value="${esc(cfg.url)}"><label class="quiet">App key</label><input class="field" id="newkey" required value="${esc(cfg.key)}">',()=>{cfg={url:$('#newurl').value.trim(),key:$('#newkey').value.trim()};set('as_cfg',cfg);toast('Backend config update ho gayi');refresh()})}
async function subscribePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window))throw Error('Push notifications supported nahi.');let permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Notification ijazat nahi mili.');let reg=await navigator.serviceWorker.ready;let key=window.maVapid;if(!key)throw Error('Backend se VAPID key nahi mili.');let sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decodeKey(key)});await api('/api/subscribe',{sub:sub.toJSON()});await api('/api/test-push',{});toast('Notifications chalu ho gayin ✦')}catch(e){toast(e.message)}}
function decodeKey(k){let s=k.replace(/-/g,'+').replace(/_/g,'/');let raw=atob(s);return Uint8Array.from(raw,c=>c.charCodeAt(0))}
window.addEventListener('online',()=>{let e=$('#netstatus');if(e){e.textContent='Online';e.classList.remove('off')}});window.addEventListener('offline',()=>{let e=$('#netstatus');if(e){e.textContent='Offline · Cache mode';e.classList.add('off')}});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredInstall=e});
applyTheme();if(cfg&&!lockOn&&!sessionStorage.getItem('ma_intro_seen')){sessionStorage.setItem('ma_intro_seen','1');let intro=document.createElement('div');intro.className='opening-overlay';intro.innerHTML='<div class="opening-inner"><div class="robot"><span class="robot-ear left"></span><span class="robot-ear right"></span><div class="robot-head"><div class="robot-face"><i class="robot-eye"></i><i class="robot-eye"></i><span class="robot-smile"></span></div></div><div class="robot-body"></div></div><b>Meri Assistant</b><small>Aap ka personal assistant ✦</small></div>';document.body.appendChild(intro);setTimeout(()=>intro.remove(),2050)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();if(cfg&&!lockOn)refresh();else if(cfg&&sessionStorage.getItem('ma_unlocked'))refresh();
})();
